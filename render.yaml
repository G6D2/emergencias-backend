services:
  - type: web
    name: emergencias-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: emergencias-db
          property: connectionString
      - key: KAFKA_BROKER
        sync: false
      - key: KAFKA_CLIENT_ID
        value: emergencias-backend
      - key: TOPIC_PANIC_BUTTON
        value: emergencias.boton-panico
      # Setear en el dashboard de Render (openssl rand -base64 32).
      # Sin esto el servicio no arranca.
      - key: LOCATION_ENCRYPTION_KEY
        sync: false
      # Para rotar la clave: ver README (Seguridad de datos).
      # - key: LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      - key: LOCATION_RETENTION_HOURS
        value: "72"
      - key: LOCATION_RETENTION_ENABLED
        value: "true"
      # Primera entrega sin IdP (Grupo 2): descomentar o setear en el dashboard de Render
      # - key: AUTH_MODE
      #   value: local
      # - key: ALLOW_LOCAL_AUTH
      #   value: "true"
      # Cuando conecten IdP: AUTH_MODE=idp + IDP_ISSUER + IDP_AUDIENCE + IDP_JWKS_URI

databases:
  - name: emergencias-db
    databaseName: emergencias
    user: emergencias
    plan: free
