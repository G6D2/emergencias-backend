# Servicio de producción (emergencias-backend-34go.onrender.com) tal como
# corre hoy. El servicio se creó desde el dashboard: este archivo documenta su
# configuración y sirve para recrearlo, pero Render no lo sincroniza solo.
# Los secretos van con `sync: false` y se cargan en el dashboard, nunca acá.
services:
  - type: web
    name: emergencias-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    # Sin auto-deploy: el CD (.github/workflows/cd.yml) migra Neon y después
    # dispara el deploy hook.
    autoDeployTrigger: "off"
    envVars:
      # Producción NO corre con NODE_ENV=production: las respuestas no traen
      # Strict-Transport-Security (verificado el 05/11/2026). El valor vive en
      # el dashboard. Con production se prenden HSTS + redirect a HTTPS y CORS
      # estricto, y AUTH_MODE=local pasa a exigir ALLOW_LOCAL_AUTH=true.
      - key: NODE_ENV
        sync: false

      # Neon (ver ADR "Elegir base de datos"): connection string *pooled* con
      # sslmode=require. No se usa Postgres de Render.
      - key: DATABASE_URL
        sync: false
      # Máximo de conexiones del pool de pg (ver README > Pool de conexiones).
      - key: DB_POOL_MAX
        value: "10"

      # Auth local (JWT propio con el contrato de CityPass+). DEV_LOGIN_STRICT
      # limita /auth/dev/login a los subs demo de src/auth/dev-login-policy.js.
      - key: AUTH_MODE
        value: local
      - key: DEV_LOGIN_STRICT
        value: "true"
      # Ya cargadas en el dashboard (valores ahí). En local, IDP_ISSUER e
      # IDP_AUDIENCE son el iss/aud de los tokens propios; en hybrid, los del
      # Login Federado.
      - key: IDP_ISSUER
        sync: false
      - key: IDP_AUDIENCE
        sync: false
      - key: IDP_MODULE
        sync: false
      - key: IDP_CLOCK_TOLERANCE_SECONDS
        sync: false
      # Para aceptar también el Login Federado del Grupo 2 (personal) sin
      # perder las cuentas locales (ciudadanos): AUTH_MODE=hybrid + lo de abajo
      # (README > Login Federado + cuentas locales). No depende de NODE_ENV ni
      # de ALLOW_LOCAL_AUTH. Revisar antes que IDP_ISSUER sea
      # https://idp.citypass.local e IDP_AUDIENCE citypass-emergencias-api (o
      # lo que traiga un token real). Volver atrás: AUTH_MODE=local.
      # - key: AUTH_MODE
      #   value: hybrid
      # - key: IDP_JWKS_URI
      #   value: https://api.citypass-login.pp.ua/.well-known/jwks.json
      # Sub federado → id del catálogo de oficiales, cuando se conozcan.
      # - key: IDP_SUB_ALIASES
      #   value: '{"<sub-federado>":"of-001"}'

      # Bus del Grupo 1. Kafka está prendido solo para consumir: el outbox no
      # publica (OUTBOX_PUBLISHER_ENABLED=false) y los eventos propios quedan
      # PENDING en outbox_events.
      - key: KAFKA_ENABLED
        value: "true"
      - key: KAFKA_BROKER
        value: test.citypass.mrfranco.net.ar:9092
      - key: KAFKA_SSL
        value: "true"
      - key: KAFKA_CLIENT_ID
        value: emergencias-backend
      - key: KAFKA_CONSUMER_ENABLED
        value: "true"
      - key: OUTBOX_PUBLISHER_ENABLED
        value: "false"
      # Listeners de cobertura preventiva (eventos de Espacios).
      - key: EDA_TOPIC_EVENTO_PUBLICADO
        value: com.citypass.espacios.EventoComunitarioPublicado
      - key: EDA_TOPIC_EVENTO_CANCELADO
        value: com.citypass.espacios.EventoCancelado
      # Alerta climática de Espacios. Los topics reales están por confirmar:
      # se cargan en el dashboard cuando Espacios los confirme. Vacíos, esos
      # listeners no arrancan. Los parámetros CONTEXTO_CLIMA_* usan el default
      # del código (ver .env.example).
      # FQN del contrato real de Espacios (cargar después de desplegar la rama):
      #   EDA_TOPIC_ALERTA_CLIMATICA_CONFIRMADA=com.citypass.espacios.CriticidadClimaticaConfirmada
      #   EDA_TOPIC_ALERTA_CLIMATICA_FINALIZADA=com.citypass.espacios.CriticidadClimaticaFinalizada
      - key: EDA_TOPIC_ALERTA_CLIMATICA_CONFIRMADA
        sync: false
      - key: EDA_TOPIC_ALERTA_CLIMATICA_FINALIZADA
        sync: false
      # Schema registry del gateway (Avro); usa el mismo token que el broker.
      - key: EDA_SCHEMA_REGISTRY_URL
        value: https://test.citypass.mrfranco.net.ar/api/v1
      # Secreto del cliente de servicio del Login Federado (SASL/OAUTHBEARER).
      # EDA_OAUTH_TOKEN_URL y EDA_OAUTH_CLIENT_ID usan el default del código.
      - key: EDA_OAUTH_CLIENT_SECRET
        sync: false
      # Topic de EmergenciaCreada. EmergenciaActualizada y EmergenciaPriorizada
      # usan el default del código (emergencias.estado-actualizado y
      # emergencias.priorizada).
      - key: TOPIC_PANIC_BUTTON
        value: emergencias.boton-panico

      # Clave AES-256-GCM de ubicaciones (openssl rand -base64 32). Sin esto el
      # servicio no arranca. Para rotar: ver README (Seguridad de datos).
      - key: LOCATION_ENCRYPTION_KEY
        sync: false
      # - key: LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      # Clave de bus (distinta a LOCATION_ENCRYPTION_KEY). Sin ella, ubicacion.latitud/longitud = null.
      - key: BUS_LOCATION_ENCRYPTION_KEY
        sync: false
      # - key: BUS_LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: BUS_LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      - key: LOCATION_RETENTION_HOURS
        value: "72"
      - key: LOCATION_RETENTION_ENABLED
        value: "true"

      # Obligatoria mientras NODE_ENV no sea production: sin ella, CORS cae a
      # http://localhost:3001 y el frontend de Render queda bloqueado.
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-krds.onrender.com
      # Rate limit por IP (ver README > Rate limiting). 'false' lo apaga.
      - key: RATE_LIMIT_ENABLED
        value: "true"

      # Keep-warm in-process (ver README > Keep-warm): en horario de clase el
      # backend se pega a sí mismo (URL pública) y al frontend cada 8 min para
      # que Render (free) no los duerma. El cron de GitHub
      # (.github/workflows/keep-warm.yml) solo hace el primer despertar.
      - key: KEEP_WARM_ENABLED
        value: "true"
      - key: KEEP_WARM_URLS
        value: https://emergencias-backend-34go.onrender.com/health,https://frontend-krds.onrender.com/api/warmup
      - key: KEEP_WARM_WINDOWS
        value: jue:17:00-23:30
      - key: KEEP_WARM_TZ
        value: America/Argentina/Buenos_Aires
      - key: KEEP_WARM_INTERVAL_MS
        value: "480000"
