# Servicio de producción (emergencias-backend-34go.onrender.com) tal como
# corre hoy. El servicio se creó desde el dashboard: este archivo documenta su
# configuración y sirve para recrearlo, pero Render no lo sincroniza solo.
# Los secretos van con `sync: false` y se cargan en el dashboard, nunca acá.
services:
  - type: web
    name: emergencias-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    # Sin auto-deploy: el CD (.github/workflows/cd.yml) migra Neon y después
    # dispara el deploy hook.
    autoDeployTrigger: "off"
    # Health check de Render (cargado en el dashboard el 17/11/2026). /health
    # responde 200 si el proceso atiende, sin mirar la base ni Kafka, y está
    # excluido del redirect a HTTPS: un deploy que no levanta no reemplaza a la
    # instancia que anda, y Render reinicia si deja de responder.
    healthCheckPath: /health
    envVars:
      # Producción corre con NODE_ENV=production desde el 17/11/2026 (antes no
      # mandaba Strict-Transport-Security). Prende HSTS + redirect a HTTPS
      # (salvo /health), deja DEV_LOGIN_STRICT en true por default y, con
      # AUTH_MODE=local, exige ALLOW_LOCAL_AUTH=true (hybrid no lo necesita).
      - key: NODE_ENV
        value: production
      # Nivel mínimo de los logs (debug, info, warn, error). Sin esta variable
      # vale el default del código: info, sin los mensajes de debug.
      # - key: LOG_LEVEL
      #   value: info

      # Neon (ver ADR "Elegir base de datos"): connection string *pooled* con
      # sslmode=require. No se usa Postgres de Render.
      - key: DATABASE_URL
        sync: false
      # Verificar el certificado de Neon (cargada el 17/11/2026). Con pg 8,
      # el sslmode=require de la URL ya se trata como verify-full (lo avisa
      # pg en el log) y pisa la opción ssl del código; esta variable deja la
      # intención explícita y cubre una URL sin sslmode. Ojo con pg 9: ahí
      # require pasa a la semántica de libpq (sin verificar), así que conviene
      # usar sslmode=verify-full en la URL antes de subir de versión.
      - key: DATABASE_SSL_VERIFY
        value: "true"
      # Máximo de conexiones del pool de pg (ver README > Pool de conexiones).
      - key: DB_POOL_MAX
        value: "10"

      # Auth híbrida desde el 12/11/2026: el personal entra por el Login
      # Federado del Grupo 2 y los ciudadanos (y los atajos de demo) con cuenta
      # local. El iss del token decide contra qué claves se valida (README >
      # Login Federado + cuentas locales). No depende de NODE_ENV ni de
      # ALLOW_LOCAL_AUTH. Volver atrás: AUTH_MODE=local.
      # DEV_LOGIN_STRICT limita /auth/dev/login a los subs demo de
      # src/auth/dev-login-policy.js.
      - key: AUTH_MODE
        value: hybrid
      - key: DEV_LOGIN_STRICT
        value: "true"
      # iss y aud del Login Federado, confirmados con un token real el
      # 12/11/2026. El iss va sin barra final: con barra el token se rechaza.
      - key: IDP_ISSUER
        value: https://idp.citypass.local
      - key: IDP_AUDIENCE
        value: citypass-emergencias-api
      - key: IDP_JWKS_URI
        value: https://api.citypass-login.pp.ua/.well-known/jwks.json
      # Cargadas en el dashboard (valores ahí).
      - key: IDP_MODULE
        sync: false
      - key: IDP_CLOCK_TOLERANCE_SECONDS
        sync: false
      # El grupo LDAP del dispatcher (`dispatcher`) ya está en el mapa por
      # default: no hizo falta IDP_GROUP_MAP. El grupo LDAP de los oficiales
      # (`poli`) también está en el default. Cada oficial LDAP necesita
      # IDP_SUB_ALIASES para llevar su sub al id del catálogo de oficiales.
      # Puente hasta implementar el ADR "Vincular los oficiales del LDAP al
      # catálogo de oficiales" (el vínculo pasa a la tabla officers).
      # U000025 = jefe.gorgory (grupo poli) → of-001, 16/11/2026.
      - key: IDP_SUB_ALIASES
        value: '{"U000025":"of-001"}'
      # Vida del token local (default 900 s = 15 minutos, sin renovación).
      # Cargada en 4 h el 17/11/2026 para que una sesión de demo no se corte en
      # medio de la presentación. Solo afecta a las cuentas locales (ciudadanos
      # y atajos de demo); el personal usa el token del Login Federado.
      - key: LOCAL_TOKEN_TTL_SECONDS
        value: "14400"

      # Bus del Grupo 1. Se consume por Kafka (SASL_SSL) y se publica por HTTP
      # al gateway desde el 05/11/2026 (ver EDA_PUBLISHER_MODE más abajo).
      - key: KAFKA_ENABLED
        value: "true"
      - key: KAFKA_BROKER
        value: test.citypass.mrfranco.net.ar:9092
      - key: KAFKA_SSL
        value: "true"
      - key: KAFKA_CLIENT_ID
        value: emergencias-backend
      - key: KAFKA_CONSUMER_ENABLED
        value: "true"
      # Particiones que el consumer procesa a la vez. Usa el default del
      # código: una por topic, hasta 3 (cada mensaje abre una transacción y el
      # pool de DB_POOL_MAX conexiones se comparte con HTTP y los jobs).
      # - key: KAFKA_CONSUMER_CONCURRENCY
      #   value: "3"
      # Publicación: el outbox manda EmergenciaCreada y EmergenciaActualizada al
      # gateway (POST /api/v1/event-types/{fqn}/events). OUTBOX_PUBLISH_SINCE
      # está cargada con la hora en que se activó (valor en el dashboard).
      - key: OUTBOX_PUBLISHER_ENABLED
        value: "true"
      - key: EDA_PUBLISHER_MODE
        value: gateway
      - key: EDA_API_URL
        value: https://test.citypass.mrfranco.net.ar
      - key: OUTBOX_PUBLISH_SINCE
        sync: false
      # Listeners de Espacios: cobertura preventiva y prioridad por evento.
      - key: EDA_TOPIC_EVENTO_PUBLICADO
        value: com.citypass.espacios.EventoComunitarioPublicado
      - key: EDA_TOPIC_EVENTO_CANCELADO
        value: com.citypass.espacios.EventoCancelado
      # ActividadCreada usa el default del código
      # (com.citypass.espacios.ActividadCreada.v3); se pisa con
      # EDA_TOPIC_ACTIVIDAD_CREADA.
      # ReservaCreada es opt-in (sin default): sin esta variable no se consume.
      - key: EDA_TOPIC_RESERVA_CREADA
        value: com.citypass.espacios.ReservaCreada
      # Umbral de personas para la cobertura preventiva, el mismo para evento,
      # actividad y reserva (respuesta de Producto en el ADR de cobertura
      # preventiva, 17/11/2026). Es el default del código; se carga explícito
      # para que prod y este archivo no dependan de un valor viejo.
      - key: UMBRAL_CAPACIDAD_COBERTURA_PREVENTIVA
        value: "500"
      # Listeners del caso ciclovía: usan el default del código
      # (com.citypass.movilidad.EmergenciaSolicitada,
      # com.citypass.reclamos.ReclamoCreado.v3 y ...ReclamoActualizado). Se
      # pisan con EDA_TOPIC_EMERGENCIA_SOLICITADA / EDA_TOPIC_RECLAMO_CREADO /
      # EDA_TOPIC_RECLAMO_ACTUALIZADO. Quién crea la intervención lo decide
      # RECLAMO_INTERVENCION_DISPARADOR: movilidad (default), reclamo o ambos.
      # Pedido de asistencia en bicicleta: listener independiente y tópico propio.
      - key: EDA_TOPIC_EMERGENCIA_BICICLETA
        value: com.citypass.movilidad.EmergenciaBicicleta
      # Alerta climática (ADR "Responder a las alertas climáticas de
      # Espacios"): opt-in, sin default; las dos van juntas. Activada en prod
      # el 17/11/2026. Radios por nivel: CONTEXTO_ZONA_RADIO_CLIMA_CRITICA_METROS
      # (default 1000) y CONTEXTO_ZONA_RADIO_CLIMA_ALTA_METROS (default 500),
      # con el default. Solo para alertas sin barrios del catálogo; con
      # barrios, el círculo de cada barrio.
      - key: EDA_TOPIC_CRITICIDAD_CLIMATICA_CONFIRMADA
        value: com.citypass.espacios.CriticidadClimaticaConfirmada
      - key: EDA_TOPIC_CRITICIDAD_CLIMATICA_FINALIZADA
        value: com.citypass.espacios.CriticidadClimaticaFinalizada
      # Piso de consumo: un grupo sin offset lee desde el principio y saltea lo
      # anterior a esta fecha. Tiene que quedar cargada siempre.
      - key: EDA_CONSUMER_SINCE
        value: "2026-11-05T15:00:00Z"
      # Radio de la prioridad por evento (default 500 m): usa el default.
      # - key: CONTEXTO_ZONA_RADIO_DEFAULT_METROS
      #   value: "500"
      # Schema registry del gateway (Avro); usa el mismo token que el broker.
      - key: EDA_SCHEMA_REGISTRY_URL
        value: https://test.citypass.mrfranco.net.ar/api/v1
      # Secreto del cliente de servicio del Login Federado (SASL/OAUTHBEARER).
      # EDA_OAUTH_TOKEN_URL y EDA_OAUTH_CLIENT_ID usan el default del código.
      - key: EDA_OAUTH_CLIENT_SECRET
        sync: false
      # Topic de EmergenciaCreada. EmergenciaActualizada y EmergenciaPriorizada
      # usan el default del código (emergencias.estado-actualizado y
      # emergencias.priorizada).
      - key: TOPIC_PANIC_BUTTON
        value: emergencias.boton-panico
      # EmergenciaVinculadaAContextoZona (ADR "Publicar el vínculo de una
      # emergencia con un contexto de zona"). Apagado hasta que el tipo esté
      # registrado en el catálogo del gateway; al pasarlo a true, correr una vez
      # `npm run backfill:vinculos-contexto` (Shell de Render).
      - key: EVENTO_VINCULO_CONTEXTO_ENABLED
        value: "false"
      # Confirmación de la alerta climática por el EDA: Emergencias publica
      # com.citypass.emergencias.CriticidadClimaticaConfirmada al recibir la de
      # Espacios. Apagada en producción (decisión de Producto del 18/11): se
      # prende cuando Analítica confirme que la ingiere y el tipo esté en el
      # catálogo del gateway (si no está, cada fila del outbox queda FAILED).
      - key: CONFIRMACION_CLIMA_ENABLED
        value: "false"

      # Clave AES-256-GCM de ubicaciones (openssl rand -base64 32). Sin esto el
      # servicio no arranca. Para rotar: ver README (Seguridad de datos).
      - key: LOCATION_ENCRYPTION_KEY
        sync: false
      # - key: LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      # Clave de bus (distinta a LOCATION_ENCRYPTION_KEY). Sin ella, ubicacion.latitud/longitud = null.
      - key: BUS_LOCATION_ENCRYPTION_KEY
        sync: false
      # - key: BUS_LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: BUS_LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      - key: LOCATION_RETENTION_HOURS
        value: "72"
      - key: LOCATION_RETENTION_ENABLED
        value: "true"

      # Explícita aunque NODE_ENV=production ya caiga al frontend de Render si
      # falta (con un warn): fuera de production el default es localhost:3001.
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-krds.onrender.com
      # Rate limit por IP (ver README > Rate limiting). 'false' lo apaga.
      - key: RATE_LIMIT_ENABLED
        value: "true"

      # Keep-warm in-process (ver README > Keep-warm): en horario de clase el
      # backend se pega a sí mismo (URL pública) y al frontend cada 8 min para
      # que Render (free) no los duerma. El cron de GitHub
      # (.github/workflows/keep-warm.yml) tendría que hacer el primer despertar,
      # pero llega tarde (el 05/11/2026 el primer ping fue a las 21:33 ART):
      # antes de la clase hay que despertar el servicio a mano con /health.
      - key: KEEP_WARM_ENABLED
        value: "true"
      - key: KEEP_WARM_URLS
        value: https://emergencias-backend-34go.onrender.com/health,https://frontend-krds.onrender.com/api/warmup
      - key: KEEP_WARM_WINDOWS
        value: jue:17:00-23:30
      - key: KEEP_WARM_TZ
        value: America/Argentina/Buenos_Aires
      - key: KEEP_WARM_INTERVAL_MS
        value: "480000"
