services:
  - type: web
    name: emergencias-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Neon (ver ADR "Elegir base de datos"): pegar en el dashboard de Render la
      # connection string *pooled* con sslmode=require. No se usa Postgres de Render.
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      # Poner en 'false' si todavia no hay un broker Kafka real desplegado
      # (evita reintentos de conexion ruidosos en los logs, no bloquea el arranque).
      - key: KAFKA_ENABLED
        value: "false"
      - key: KAFKA_CLIENT_ID
        value: emergencias-backend
      - key: TOPIC_PANIC_BUTTON
        value: emergencias.boton-panico
      - key: TOPIC_EMERGENCIA_CERRADA
        value: emergencias.cerrada
      # Setear en el dashboard de Render (openssl rand -base64 32).
      # Sin esto el servicio no arranca.
      - key: LOCATION_ENCRYPTION_KEY
        sync: false
      # Para rotar la clave: ver README (Seguridad de datos).
      # - key: LOCATION_ENCRYPTION_KEYS
      #   sync: false
      # - key: LOCATION_ENCRYPTION_KEY_ID
      #   sync: false
      - key: LOCATION_RETENTION_HOURS
        value: "72"
      - key: LOCATION_RETENTION_ENABLED
        value: "true"
      # Keep-warm in-process (ver README > Deploy > Keep-warm): en horario de
      # clase el backend se pega a sí mismo (URL pública) y al frontend cada
      # 8 min para que Render (free) no los duerma. El cron de GitHub
      # (.github/workflows/keep-warm.yml) solo hace el primer despertar.
      - key: KEEP_WARM_ENABLED
        value: "true"
      - key: KEEP_WARM_URLS
        value: https://emergencias-backend-34go.onrender.com/health,https://frontend-krds.onrender.com/api/warmup
      - key: KEEP_WARM_WINDOWS
        value: jue:17:00-23:30
      - key: KEEP_WARM_TZ
        value: America/Argentina/Buenos_Aires
      - key: KEEP_WARM_INTERVAL_MS
        value: "480000"
      # Primera entrega sin IdP (Grupo 2): descomentar o setear en el dashboard de Render
      # - key: AUTH_MODE
      #   value: local
      # - key: ALLOW_LOCAL_AUTH
      #   value: "true"
      # Cuando conecten IdP: AUTH_MODE=idp + IDP_ISSUER + IDP_AUDIENCE + IDP_JWKS_URI
