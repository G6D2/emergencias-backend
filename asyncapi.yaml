  schemas:
    Metadata:
      type: object
      description: |
        Envelope que agrega el gateway EDA. `eventId` es la clave de
        deduplicación (`eventos_procesados`).
      required: [eventId]
      additionalProperties: true
      properties:
        eventId:
          type: string
        eventType:
          type: string
        source:
          type: string
        occurredAt:
          type: string
          format: date-time
        version:
          type: string
        causationId:
          type: [string, 'null']

    Prioridad:
      type: string
      enum: [BAJA, MEDIA, ALTA, CRITICA]

    Estado:
      type: string
      description: Traducción de `emergencies.status` (ver `STATUS_TO_ESTADO`).
      enum: [PENDIENTE, VALIDADA, DESPACHADA, EN_CAMINO, EN_LUGAR, RESUELTA, CERRADA, DESCARTADA, CANCELADA]

    Categoria:
      type: string
      description: Catálogo de `src/domain/emergency-type.js`.
      enum: [MEDICA, INCENDIO, INFRAESTRUCTURA, DISTURBIO_EVENTO_MASIVO, OTRO, PANICO, PREVENTIVA, TRANSITO]

    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC.

    EmergenciaCreadaData:
      type: object
      additionalProperties: false
      required:
        - emergenciaId
        - categoria
        - prioridad
        - estado
        - barrio
        - latitud
        - longitud
        - ubicacion
        - afectaCirculacion
        - causaId
        - causaTipo
        - prioridadOriginal
        - ciudadanoId
        - correlationId
        - createdAt
      properties:
        emergenciaId:
          type: string
        categoria:
          oneOf:
            - $ref: '#/components/schemas/Categoria'
            - type: 'null'
        prioridad:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        estado:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        barrio:
          type: [string, 'null']
          description: Barrio del catálogo oficial de CABA (48), en claro. Lo leen Reclamos y Analítica.
        latitud:
          type: [number, 'null']
          description: Latitud en claro, redondeada a 3 decimales (~100 m). Null si la emergencia no tiene ubicación. Es la que leen los consumidores; la exacta va cifrada en `ubicacion`.
        longitud:
          type: [number, 'null']
          description: Igual que `latitud`.
        ubicacion:
          type: object
          additionalProperties: false
          required: [barrio, latitud, longitud]
          properties:
            barrio:
              type: [string, 'null']
              description: Mismo valor que `barrio`, anidado para Espacios.
            latitud:
              type: [string, 'null']
              description: Coordenada exacta, ciphertext AES-256-GCM con la clave de bus (ver docs/bus-ubicacion-para-consumidores.md). Null sin clave de bus.
            longitud:
              type: [string, 'null']
              description: Igual que `latitud`. La versión aproximada en claro va en la raíz de `data`.
        afectaCirculacion:
          type: [boolean, 'null']
          description: Derivado de `categoria`. true para INCENDIO, INFRAESTRUCTURA, DISTURBIO_EVENTO_MASIVO y TRANSITO; false para MEDICA, PANICO, OTRO y PREVENTIVA (una cobertura programada no corta la calle, desde el 17/11/2026); null sin categoría.
        causaId:
          type: [string, 'null']
        causaTipo:
          type: [string, 'null']
          examples: [EVENTO_PUBLICO]
        prioridadOriginal:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        ciudadanoId:
          type: [string, 'null']
        correlationId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    EmergenciaActualizadaData:
      type: object
      additionalProperties: false
      required:
        - emergenciaId
        - estadoAnterior
        - estadoNuevo
        - updatedAt
        - resueltoAt
        - usuarioId
        - asignadoA
        - areaResponsable
        - resolucion
        - prioridad
        - causasRelacionadas
        - descripcionProblema
        - barrio
        - latitud
        - longitud
        - ubicacion
        - correlationId
      properties:
        emergenciaId:
          type: string
        estadoAnterior:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        estadoNuevo:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        resueltoAt:
          description: Solo en transición a `RESUELTA`.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        usuarioId:
          type: [string, 'null']
          description: Actor del request.
        asignadoA:
          type: [string, 'null']
          description: Oficial asignado, solo en `DESPACHADA`.
        areaResponsable:
          type: [string, 'null']
          description: Null hasta #85.
        resolucion:
          type: [string, 'null']
        prioridad:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        causasRelacionadas:
          type: array
          default: []
          items:
            type: string
            enum: [VIA, ESPACIO_PUBLICO, RESIDUOS]
        descripcionProblema:
          type: [string, 'null']
          maxLength: 280
          description: Descripción breve del problema vial. Se completa al resolver si causasRelacionadas incluye VIA y se conserva en actualizaciones posteriores.
        barrio:
          type: [string, 'null']
          description: Barrio del catálogo oficial de CABA (48), en claro.
        latitud:
          type: [number, 'null']
          description: Latitud en claro, redondeada a 3 decimales (~100 m). Null si la emergencia no tiene ubicación. Es la que leen los consumidores; la exacta va cifrada en `ubicacion`.
        longitud:
          type: [number, 'null']
          description: Igual que `latitud`.
        ubicacion:
          type: object
          additionalProperties: false
          required: [barrio, latitud, longitud]
          properties:
            barrio:
              type: [string, 'null']
            latitud:
              type: [string, 'null']
              description: Ciphertext AES-256-GCM con la clave de bus. Null sin clave de bus.
            longitud:
              type: [string, 'null']
              description: Ciphertext AES-256-GCM con la clave de bus. Null sin clave de bus.
        correlationId:
          type: string
      allOf:
        - description: Se requiere una descripción no vacía cuando las causas incluyen VIA; en los demás casos debe ser null.
          if:
            properties:
              causasRelacionadas:
                contains:
                  const: VIA
          then:
            properties:
              descripcionProblema:
                type: string
                minLength: 1
          else:
            properties:
              descripcionProblema:
                type: 'null'

    EmergenciaPriorizadaData:
      type: object
      additionalProperties: false
      required: [id, correlationId, incidentId, priorityIndividual, incidentPriority, priority, score, reasonCodes, algorithmVersion]
      properties:
        id:
          type: string
        correlationId:
          type: string
        incidentId:
          type: string
        priorityIndividual:
          type: [string, 'null']
        incidentPriority:
          type: [string, 'null']
        priority:
          type: [string, 'null']
        score:
          type: [number, 'null']
        reasonCodes:
          type: [array, 'null']
          items:
            type: string
        algorithmVersion:
          type: [string, 'null']

    CriticidadClimaticaRecibidaData:
      type: object
      additionalProperties: false
      description: |
        Mismo record que `com.citypass.residuos.CriticidadClimaticaConfirmada`.
        `NivelCriticidad` va con mayúscula, como en ese schema.
      required: [alertaId, NivelCriticidad, fenomeno]
      properties:
        alertaId:
          type: string
          description: El `alertaId` de la alerta de Espacios.
        NivelCriticidad:
          type: string
          description: El `nivelCriticidad` que mandó Espacios (BAJA, MEDIA, ALTA o CRITICA).
        fenomeno:
          type: string
          description: El `fenomeno` que mandó Espacios.

    EmergenciaVinculadaAContextoZonaData:
      type: object
      additionalProperties: false
      required: [emergenciaId, contextoId, contextoTipo, contextoOrigen, referenciaExterna, radioMetros, vinculadaEn, reglaVersion, backfill]
      properties:
        emergenciaId:
          type: string
          format: uuid
        contextoId:
          type: string
          format: uuid
        contextoTipo:
          type: string
          enum: [EVENTO_ESPACIO_PUBLICO, ALERTA_CLIMATICA]
        contextoOrigen:
          type: string
          description: Módulo que originó el contexto (hoy, espacios).
        referenciaExterna:
          type: string
          description: |
            Id en el módulo de origen. Con `EVENTO_ESPACIO_PUBLICO`, el `eventoId` de
            Espacios; con `ALERTA_CLIMATICA`, `<alertaId>#<índice del punto>`. Clave
            para agrupar por evento o alerta.
        radioMetros:
          type: integer
          minimum: 1
        vinculadaEn:
          type: string
          format: date-time
        reglaVersion:
          type: integer
          minimum: 1
          description: Sube si cambia la forma de decidir el vínculo.
        backfill:
          type: boolean
          description: true si salió de la carga inicial y no del alta de la emergencia.

    EventoComunitarioPublicadoData:
      type: object
      additionalProperties: true
      required: [eventoId]
      properties:
        eventoId:
          type: string
          minLength: 1
        titulo:
          type: string
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        direccion:
          type: [string, 'null']
        capacidad:
          type: number
          description: Asistentes esperados. Si falta se usa `cupoMaximo`.
        cupoMaximo:
          type: number
        estado:
          type: string
          description: Con `CANCELLED` no se programa cobertura y se da de baja el contexto de zona.
        inicio:
          description: |
            Inicio del evento (ISO 8601 o epoch). También se lee `fechaInicio`. Es el
            comienzo de la ventana en la que sube la prioridad del barrio; si falta,
            la ventana arranca al recibir el evento.
        fin:
          description: |
            Fin del evento (ISO 8601 o epoch). También se lee `fechaFin`. Si falta,
            la ventana dura `CONTEXTO_ZONA_DURACION_DEFAULT_HORAS` (default 6).
        zona:
          type: [string, 'null']
          description: Texto libre. Solo se usa sin coordenadas, si coincide con un barrio de CABA.
        correlationId:
          type: string
          description: En Espacios no es UUID (`evento-<id>`).

    ActividadCreadaData:
      type: object
      additionalProperties: true
      required: [actividadId]
      properties:
        actividadId:
          type: string
          minLength: 1
          description: Mismo valor que el `eventoId` de `EventoComunitarioPublicado`.
        titulo:
          type: string
        organizadorTipo:
          type: string
          enum: [CIUDAD, CIUDADANO]
          description: |
            Obligatorio desde la v3. CIUDAD: lo creó un administrador municipal;
            CIUDADANO: lo creó un ciudadano. Hoy siempre llega CIUDAD. La regla de
            cobertura no lo usa.
        capacidad:
          type: integer
          description: Personas esperadas (no hay campo de asistentes).
        ubicacion:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        direccion:
          type: [string, 'null']
        estado:
          type: string
          description: Llega `PROGRAMADA`. Con `CANCELADA` no se programa cobertura.
        correlationId:
          type: string
          description: En Espacios no es UUID (`act-<id>`).
        fechaHoraInicio:
          type: integer
          description: Epoch millis.
        fechaHoraFinalizacion:
          type: integer
          description: Epoch millis. Espacios no publica nada cuando la actividad termina.

    EventoCanceladoData:
      type: object
      additionalProperties: true
      required: [eventoId]
      properties:
        eventoId:
          type: string
          minLength: 1
        motivo:
          type: string
        canceladoEn:
          $ref: '#/components/schemas/Timestamp'

    ReservaCreadaData:
      type: object
      additionalProperties: true
      required: [reservaId, tipoReserva, cantidadPersonas]
      properties:
        reservaId:
          type: string
          minLength: 1
        tipoReserva:
          type: string
          enum: [ESPACIO, EVENTO]
          description: Solo `ESPACIO` programa cobertura; las inscripciones las cubre `EVENTO_PUBLICO`.
        categoria:
          type: [string, 'null']
          description: Categoría del espacio (`PLAZA`, `SALON`, ...). Va en la descripción de la emergencia.
        zona:
          type: [string, 'null']
          description: Texto libre. Solo se usa sin coordenadas, si coincide con un barrio de CABA.
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        fechaFin:
          type: string
          description: ISO 8601. Una reserva que ya terminó no programa cobertura.
        cantidadPersonas:
          type: integer
        correlationId:
          type: string
          description: En Espacios es el mismo `reservaId` (no UUID).

    CriticidadClimaticaConfirmadaData:
      type: object
      additionalProperties: true
      required: [alertaId, nivelCriticidad]
      properties:
        alertaId:
          type: string
          minLength: 1
        nivelCriticidad:
          type: string
          enum: [BAJA, MEDIA, ALTA, CRITICA]
          description: Solo `ALTA` y `CRITICA` generan contextos y emergencia.
        fenomeno:
          type: string
          examples: [TORMENTA_FUERTE, LLUVIA_INTENSA, GRANIZO]
        ubicaciones:
          type: array
          description: Puntos de la consulta meteorológica. No son un polígono ni traen radio.
          items:
            type: object
            properties:
              latitud:
                type: number
              longitud:
                type: number
        barrios:
          type: array
          items:
            type: string
        vigenciaDesde:
          type: integer
          description: Epoch en milisegundos (timestamp-millis de Avro).
        vigenciaHasta:
          type: integer
          description: Epoch en milisegundos (timestamp-millis de Avro).

    CriticidadClimaticaFinalizadaData:
      type: object
      additionalProperties: true
      required: [alertaId]
      properties:
        alertaId:
          type: string
          minLength: 1
        finalizadaEn:
          type: integer
          description: Epoch en milisegundos (timestamp-millis de Avro).

    ReclamoCreadoData:
      type: object
      additionalProperties: true
      description: Solo los campos que lee Emergencias. El schema completo está en `docs/avro/ReclamoCreado.avsc` del repo de Reclamos.
      required: [reclamoId, categoria]
      properties:
        reclamoId:
          type: string
          minLength: 1
        categoria:
          type: string
          description: Solo `TRANSITO` dispara una intervención.
        objetoAfectado:
          type: [string, 'null']
          description: Lo elige el vecino; puede venir null. Solo `CICLOVIA` dispara una intervención.
        prioridad:
          type: string
          description: BAJA, MEDIA, ALTA o CRITICA. Define la prioridad de la emergencia.
        estado:
          type: string
        titulo:
          type: string
        direccion:
          type: [string, 'null']
        barrio:
          type: [string, 'null']
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        afectaCirculacion:
          type: boolean
        correlationId:
          type: [string, 'null']
        createdAt:
          type: integer
          description: Epoch en milisegundos.

    ReclamoActualizadoData:
      type: object
      additionalProperties: true
      required: [reclamoId, estadoNuevo]
      properties:
        reclamoId:
          type: string
          minLength: 1
        estadoAnterior:
          type: string
        estadoNuevo:
          type: string
          description: RECIBIDO, EN_REVISION, ASIGNADO, EN_PROCESO, RESUELTO, RECHAZADO o CERRADO. Los tres últimos cancelan la intervención pendiente.
        updatedAt:
          type: integer
          description: Epoch en milisegundos.

    EmergenciaSolicitadaData:
      type: object
      additionalProperties: true
      description: Solo los campos que lee Emergencias. El schema completo es `EmergenciaSolicitada.json` del repo de Movilidad.
      required: [reclamoId]
      properties:
        reclamoId:
          type: string
          minLength: 1
          description: Reclamo que originó el pedido. Es la causa de la emergencia.
        correlationId:
          type: [string, 'null']
        origen:
          type: string
        tipoEmergencia:
          type: string
          examples: [OBSTRUCCION_CICLOVIA_CRITICA]
        prioridad:
          type: string
          description: ALTA o CRITICA. Define la prioridad de la emergencia; otro valor cae a MEDIA.
        descripcion:
          type: string
        direccion:
          type: [string, 'null']
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        solicitadoAt:
          type: integer
          description: Epoch en milisegundos.

    EmergenciaBicicletaData:
      type: object
      additionalProperties: false
      required: [emergenciaId, reportadaEn, ubicacion, triage, viaje, usuario]
      properties:
        emergenciaId:
          type: string
          minLength: 1
          description: ID externo que se usa para deduplicar y como correlationId de Emergencias.
        actorSub:
          type: [string, 'null']
          description: No se persiste ni se usa como ciudadano interno.
        reportadaEn:
          type: integer
          description: Epoch en milisegundos.
        ubicacion:
          type: object
          additionalProperties: false
          required: [latitud, longitud]
          properties:
            latitud:
              type: number
              minimum: -90
              maximum: 90
            longitud:
              type: number
              minimum: -180
              maximum: 180
            precisionMetros:
              type: [number, 'null']
              minimum: 0
        triage:
          type: object
          additionalProperties: false
          required: [respondido, prioridadSugerida]
          properties:
            respondido:
              type: boolean
            puedeMoverse:
              type: [boolean, 'null']
            estaSangrando:
              type: [boolean, 'null']
            vehiculoInvolucrado:
              type: [boolean, 'null']
            prioridadSugerida:
              type: string
              enum: [P1, P2, P3, P4]
        viaje:
          type: object
          additionalProperties: false
          required: [viajeId, iniciadoEn, estacionOrigenId, estacionOrigenNombre, bicicletaId, bicicletaCodigo]
          properties:
            viajeId:
              type: integer
            iniciadoEn:
              type: integer
              description: Epoch en milisegundos.
            estacionOrigenId:
              type: integer
            estacionOrigenNombre:
              type: string
            bicicletaId:
              type: integer
            bicicletaCodigo:
              type: string
        usuario:
          type: object
          additionalProperties: false
          description: Se recibe según el schema de Movilidad, pero sus datos personales no se persisten.
          required: [usuarioId, nombre, apellido, email]
          properties:
            usuarioId:
              type: integer
            nombre:
              type: string
            apellido:
              type: string
            email:
              type: string
              format: email
