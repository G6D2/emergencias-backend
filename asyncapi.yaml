asyncapi: 3.1.0
info:
  title: Emergencias Backend — Eventos
  version: 0.1.0
  description: |
    Contrato de eventos del módulo de Emergencias y Seguridad (CityPass+, Grupo 6)
    en el bus EDA.

    - **Publica** `EmergenciaCreada` y `EmergenciaActualizada` (contrato cerrado en
      el issue #48 de `G6D2/demo-repository`, 2026-11-02). Los arma
      `src/services/emergency-events.js` y salen por el outbox transaccional
      (`OutboxPublisher`).
    - **Consume** `EventoComunitarioPublicado`, `EventoCancelado` y `ReservaCreada`
      de Espacios Públicos (cobertura preventiva, `src/listeners/cobertura-preventiva`).
    - **Consume** `CriticidadClimaticaConfirmada` y `CriticidadClimaticaFinalizada`
      de Espacios Públicos (alerta climática, `src/listeners/alerta-climatica`;
      ADR "Responder a las alertas climáticas de Espacios"). Opt-in.
    - **Consume** `EmergenciaBicicleta` de Movilidad (asistencia durante un viaje,
      `src/listeners/movilidad-bicicleta`), sin reemplazar `EmergenciaSolicitada`
      (intervención por obstrucción de ciclovía).

    Sobre el bus los eventos viajan con el envelope `{ metadata, data }` que arma
    el gateway del Grupo 1 (Avro en formato Confluent, schema en
    `EDA_SCHEMA_REGISTRY_URL`). En modo `EDA_PUBLISHER_MODE=gateway` este backend
    POSTea solo `data`; el gateway agrega `metadata`.

    Entrega **at-least-once**, **en orden por emergencia** dentro de cada canal:
    el outbox no publica un evento mientras haya uno anterior de la misma
    emergencia sin publicar, y el gateway particiona por `data.correlationId`.
    Entre emergencias distintas, y entre canales distintos, no hay orden (ver
    `docs/diagramas/06-eventos.md`). Los consumidores deduplican por
    `metadata.eventId`.

    Este archivo se valida en `npm test` (`src/tests/asyncapi.test.js`): el spec
    tiene que parsear y la salida de los builders tiene que cumplir los schemas
    de `data`. Si cambiás un builder, cambiá este archivo.
  license:
    name: MIT
  tags:
    - name: emergencias
    - name: cobertura-preventiva

defaultContentType: application/json

servers:
  gateway:
    host: test.citypass.mrfranco.net.ar
    protocol: kafka-secure
    description: |
      Broker del gateway EDA (Grupo 1). SASL_SSL con OAUTHBEARER: el token
      client-credentials sale del Login Federado (`EDA_OAUTH_*`). El host real
      del broker se configura con `KAFKA_BROKER`.
    security:
      - $ref: '#/components/securitySchemes/oauthClientCredentials'
    bindings:
      kafka:
        schemaRegistryUrl: https://test.citypass.mrfranco.net.ar/api/v1
        schemaRegistryVendor: confluent
  local:
    host: localhost:9092
    protocol: kafka
    description: Kafka del `docker-compose.yml` (sin SASL, JSON plano).

channels:
  emergenciaCreada:
    address: com.citypass.emergencias.EmergenciaCreada
    title: EmergenciaCreada
    description: |
      Alta de una emergencia: botón de pánico (`POST /api/panic-button`) o
      cobertura preventiva creada por el listener de Espacios.
      Con `EDA_PUBLISHER_MODE=kafka` sale por el topic `TOPIC_PANIC_BUTTON`
      (default `emergencias.boton-panico`).
    messages:
      emergenciaCreada:
        $ref: '#/components/messages/EmergenciaCreada'

  emergenciaActualizada:
    address: com.citypass.emergencias.EmergenciaActualizada
    title: EmergenciaActualizada
    description: |
      Cambio de estado de una emergencia (validate, discard, assign, en-route,
      on-scene, resolve, cancel, close). El cierre viaja como este mismo evento
      con `estadoNuevo = CERRADA` (`EmergenciaCerrada` quedó fuera del contrato).
      Con `EDA_PUBLISHER_MODE=kafka` sale por `TOPIC_EMERGENCIA_ESTADO_ACTUALIZADO`
      (default `emergencias.estado-actualizado`).
    messages:
      emergenciaActualizada:
        $ref: '#/components/messages/EmergenciaActualizada'

  emergenciaVinculadaAContextoZona:
    address: com.citypass.emergencias.EmergenciaVinculadaAContextoZona
    title: EmergenciaVinculadaAContextoZona
    description: |
      Una emergencia quedó vinculada a un contexto de zona (evento comunitario
      o punto de una alerta climática de Espacios) al crearse; mientras los dos
      estuvieron vigentes, su prioridad de despacho estuvo un nivel arriba. Un
      evento por fila de
      `emergencia_contexto_zona`, encolado en la misma sentencia que la fila.
      Clave de deduplicación: (`emergenciaId`, `contextoId`). Para contar por
      evento de Espacios, agrupar por `referenciaExterna`. No lleva
      coordenadas. Se publican los vínculos de todas las categorías, `PANICO`
      incluida. Solo se encola con `EVENTO_VINCULO_CONTEXTO_ENABLED=true`, hoy
      apagado en producción hasta que el tipo esté registrado en el catálogo
      del gateway.
      Con `EDA_PUBLISHER_MODE=kafka` sale por `TOPIC_EMERGENCIA_VINCULADA_CONTEXTO`
      (default `emergencias.vinculada-contexto-zona`). Schema:
      `docs/contratos/emergencia-vinculada-a-contexto-zona.schema.json`.
    messages:
      emergenciaVinculadaAContextoZona:
        $ref: '#/components/messages/EmergenciaVinculadaAContextoZona'

  criticidadClimaticaRecibida:
    address: com.citypass.emergencias.CriticidadClimaticaConfirmada
    title: CriticidadClimaticaConfirmada (confirmación de Emergencias)
    description: |
      Emergencias confirma que recibió una alerta climática confirmada de
      Espacios (`com.citypass.espacios.CriticidadClimaticaConfirmada`). Mismo
      contrato que publica Residuos: `alertaId`, `NivelCriticidad` y
      `fenomeno`, reenviados tal cual llegaron. Uno por alerta recibida, de
      cualquier nivel. Sale por el outbox en la misma transacción que la
      emergencia y los contextos de la alerta. Solo se encola con
      `CONFIRMACION_CLIMA_ENABLED=true`. Topic configurable con
      `TOPIC_CONFIRMACION_CLIMA`.
    messages:
      criticidadClimaticaRecibida:
        $ref: '#/components/messages/CriticidadClimaticaRecibida'

  emergenciaPriorizada:
    address: emergencias.priorizada
    title: EmergenciaPriorizada (interno)
    description: |
      Cambio de prioridad de un incidente (job de detección, cada 60s, solo si
      cambió la `priority`). **No es parte del contrato del bus**: el
      `GatewayPublisher` lo marca `SKIPPED`. Solo sale con
      `EDA_PUBLISHER_MODE=kafka` por `TOPIC_EMERGENCIA_PRIORIZADA`.
    servers:
      - $ref: '#/servers/local'
    messages:
      emergenciaPriorizada:
        $ref: '#/components/messages/EmergenciaPriorizada'

  eventoComunitarioPublicado:
    address: com.citypass.espacios.EventoComunitarioPublicado
    title: EventoComunitarioPublicado (Espacios Públicos)
    description: |
      Topic configurable con `EDA_TOPIC_EVENTO_PUBLICADO`. Espacios lo republica
      cada vez que cambian los inscriptos.
    messages:
      eventoComunitarioPublicado:
        $ref: '#/components/messages/EventoComunitarioPublicado'

  eventoCancelado:
    address: com.citypass.espacios.EventoCancelado
    title: EventoCancelado (Espacios Públicos)
    description: Topic configurable con `EDA_TOPIC_EVENTO_CANCELADO`.
    messages:
      eventoCancelado:
        $ref: '#/components/messages/EventoCancelado'

  reservaCreada:
    address: com.citypass.espacios.ReservaCreada
    title: ReservaCreada (Espacios Públicos)
    description: |
      Opt-in: solo se consume con `EDA_TOPIC_RESERVA_CREADA` cargada (no tiene
      default). Espacios lo publica al reservar un espacio o inscribirse a un
      evento.
    messages:
      reservaCreada:
        $ref: '#/components/messages/ReservaCreada'

  criticidadClimaticaConfirmada:
    address: com.citypass.espacios.CriticidadClimaticaConfirmada
    title: CriticidadClimaticaConfirmada (Espacios Públicos)
    description: |
      Opt-in: solo se consume con `EDA_TOPIC_CRITICIDAD_CLIMATICA_CONFIRMADA`
      cargada (no tiene default; confirmar el nombre en el catálogo del gateway
      antes de cargarla). Un administrador de Espacios confirmó una alerta
      climática (schemaId 28).
    messages:
      criticidadClimaticaConfirmada:
        $ref: '#/components/messages/CriticidadClimaticaConfirmada'

  criticidadClimaticaFinalizada:
    address: com.citypass.espacios.CriticidadClimaticaFinalizada
    title: CriticidadClimaticaFinalizada (Espacios Públicos)
    description: |
      Opt-in: solo se consume con `EDA_TOPIC_CRITICIDAD_CLIMATICA_FINALIZADA`
      cargada (no tiene default). La alerta venció o se cerró a mano; trae el
      mismo `alertaId` (schemaId 27).
    messages:
      criticidadClimaticaFinalizada:
        $ref: '#/components/messages/CriticidadClimaticaFinalizada'

  emergenciaSolicitada:
    address: com.citypass.movilidad.EmergenciaSolicitada
    title: EmergenciaSolicitada (Movilidad)
    description: |
      Topic configurable con `EDA_TOPIC_EMERGENCIA_SOLICITADA`. Movilidad lo
      publica cuando evalúa un reclamo de ciclovía de prioridad ALTA o CRITICA.
    messages:
      emergenciaSolicitada:
        $ref: '#/components/messages/EmergenciaSolicitada'

  emergenciaBicicleta:
    address: com.citypass.movilidad.EmergenciaBicicleta
    title: EmergenciaBicicleta (Movilidad)
    description: |
      Pedido de asistencia durante un viaje en bicicleta pública. Se deduplica
      por `data.emergenciaId`, que también se conserva como `correlationId` en
      los eventos de Emergencias. `EmergenciaSolicitada` sigue siendo el flujo
      independiente para obstrucciones de ciclovía.
    messages:
      emergenciaBicicleta:
        $ref: '#/channels/emergenciaBicicleta/messages/emergenciaBicicleta'

  reclamoCreado:
    address: com.citypass.reclamos.ReclamoCreado.v3
    title: ReclamoCreado v3 (Reclamos)
    description: |
      Topic configurable con `EDA_TOPIC_RECLAMO_CREADO`. La versión vigente del
      tipo es la 3 y va en su propio tópico (la 1 no trae `objetoAfectado`).
    messages:
      reclamoCreado:
        $ref: '#/components/messages/ReclamoCreado'

  reclamoActualizado:
    address: com.citypass.reclamos.ReclamoActualizado
    title: ReclamoActualizado (Reclamos)
    description: Topic configurable con `EDA_TOPIC_RECLAMO_ACTUALIZADO`.
    messages:
      reclamoActualizado:
        $ref: '#/components/messages/ReclamoActualizado'

  actividadCreada:
    address: com.citypass.espacios.ActividadCreada.v3
    title: ActividadCreada v3 (Espacios Públicos)
    description: |
      Topic configurable con `EDA_TOPIC_ACTIVIDAD_CREADA`. Espacios lo publica
      una vez, justo después de `EventoComunitarioPublicado`. El `actividadId`
      es el mismo valor que el `eventoId` de ese evento.
    messages:
      actividadCreada:
        $ref: '#/components/messages/ActividadCreada'

operations:
  publicarEmergenciaCreada:
    action: send
    channel:
      $ref: '#/channels/emergenciaCreada'
    summary: Publica el alta de una emergencia.
    messages:
      - $ref: '#/channels/emergenciaCreada/messages/emergenciaCreada'

  publicarEmergenciaActualizada:
    action: send
    channel:
      $ref: '#/channels/emergenciaActualizada'
    summary: Publica un cambio de estado de una emergencia.
    messages:
      - $ref: '#/channels/emergenciaActualizada/messages/emergenciaActualizada'

  publicarEmergenciaVinculadaAContextoZona:
    action: send
    channel:
      $ref: '#/channels/emergenciaVinculadaAContextoZona'
    summary: Publica el vínculo de una emergencia con un contexto de zona.
    messages:
      - $ref: '#/channels/emergenciaVinculadaAContextoZona/messages/emergenciaVinculadaAContextoZona'

  publicarConfirmacionCriticidadClimatica:
    action: send
    channel:
      $ref: '#/channels/criticidadClimaticaRecibida'
    summary: Confirma por el EDA que Emergencias recibió una alerta climática de Espacios.
    messages:
      - $ref: '#/channels/criticidadClimaticaRecibida/messages/criticidadClimaticaRecibida'

  publicarEmergenciaPriorizada:
    action: send
    channel:
      $ref: '#/channels/emergenciaPriorizada'
    summary: Publica el cambio de prioridad de un incidente (solo Kafka directo).
    messages:
      - $ref: '#/channels/emergenciaPriorizada/messages/emergenciaPriorizada'

  recibirEventoComunitarioPublicado:
    action: receive
    channel:
      $ref: '#/channels/eventoComunitarioPublicado'
    summary: |
      Programa una cobertura preventiva (emergencia `PREVENTIVA`) si la capacidad
      supera `UMBRAL_CAPACIDAD_COBERTURA_PREVENTIVA` (default 500). Además registra
      un contexto de zona en el punto del evento (`latitud`, `longitud`) con un
      radio fijo (`CONTEXTO_ZONA_RADIO_DEFAULT_METROS`, default 500): mientras dura
      (`inicio`–`fin`), las emergencias que se crean dentro de ese radio suben un
      nivel de prioridad de despacho.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EventoComunitarioPublicadoListener
    messages:
      - $ref: '#/channels/eventoComunitarioPublicado/messages/eventoComunitarioPublicado'

  recibirActividadCreada:
    action: receive
    channel:
      $ref: '#/channels/actividadCreada'
    summary: |
      Programa una cobertura preventiva (emergencia `PREVENTIVA`) si la capacidad
      llega a `UMBRAL_CAPACIDAD_COBERTURA_PREVENTIVA` (default 500), la actividad no terminó (`fechaHoraFinalizacion`) y no es una
      reserva de ciudadano (`organizadorTipo: CIUDADANO`). Usa el
      `actividadId` como causa, así que no duplica la cobertura que ya haya
      creado `EventoComunitarioPublicado`.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ActividadCreadaListener
    messages:
      - $ref: '#/channels/actividadCreada/messages/actividadCreada'

  recibirEventoCancelado:
    action: receive
    channel:
      $ref: '#/channels/eventoCancelado'
    summary: |
      Cancela la cobertura preventiva del evento si todavía no fue despachada y da
      de baja su contexto de zona (la prioridad de las emergencias cercanas vuelve a la normal).
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EventoCanceladoListener
    messages:
      - $ref: '#/channels/eventoCancelado/messages/eventoCancelado'

  recibirReservaCreada:
    action: receive
    channel:
      $ref: '#/channels/reservaCreada'
    summary: |
      Programa una cobertura preventiva (`PREVENTIVA`, causa `RESERVA`, `causaId` =
      `reservaId`) para una reserva de espacio (`tipoReserva = ESPACIO`) de
      `UMBRAL_PERSONAS_COBERTURA_RESERVA` personas o más (default 500) que no
      terminó. Una sola por reserva.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ReservaCreadaListener
    messages:
      - $ref: '#/channels/reservaCreada/messages/reservaCreada'

  recibirCriticidadClimaticaConfirmada:
    action: receive
    channel:
      $ref: '#/channels/criticidadClimaticaConfirmada'
    summary: |
      Solo con `nivelCriticidad` `ALTA` o `CRITICA` (`BAJA` y `MEDIA` no generan
      nada). Registra un contexto de zona `ALERTA_CLIMATICA` por cada punto de
      `ubicaciones`, con el radio del nivel (`CRITICA` 1000 m,
      `CONTEXTO_ZONA_RADIO_CLIMA_CRITICA_METROS`; `ALTA` 500 m,
      `CONTEXTO_ZONA_RADIO_CLIMA_ALTA_METROS`) y la ventana
      `vigenciaDesde`–`vigenciaHasta`. Si la alerta todavía está vigente, crea
      una única emergencia `PREVENTIVA` por `alertaId` (causa
      `EVENTO_CLIMATICO`, severidad `high` o `critical`), que sale en
      `EmergenciaCreada` con `prioridadOriginal`. Si la alerta ya se finalizó,
      no crea nada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.CriticidadClimaticaConfirmadaListener
    messages:
      - $ref: '#/channels/criticidadClimaticaConfirmada/messages/criticidadClimaticaConfirmada'

  recibirCriticidadClimaticaFinalizada:
    action: receive
    channel:
      $ref: '#/channels/criticidadClimaticaFinalizada'
    summary: |
      Da de baja los contextos de la alerta y cancela su emergencia climática si
      todavía no fue despachada (`PENDING`/`VALIDATED`), con
      `EmergenciaActualizada`. Si llega antes que la confirmación, la
      confirmación tardía no crea contextos ni emergencia.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.CriticidadClimaticaFinalizadaListener
    messages:
      - $ref: '#/channels/criticidadClimaticaFinalizada/messages/criticidadClimaticaFinalizada'

  recibirEmergenciaSolicitada:
    action: receive
    channel:
      $ref: '#/channels/emergenciaSolicitada'
    summary: |
      Disparador del caso "reclamo por ciclovía" (Reclamos → Movilidad →
      Emergencias): crea una emergencia externa `TRANSITO` (causa `RECLAMO`,
      `causaId` = `reclamoId`), una sola por reclamo, con la prioridad pedida.
      No aplica con `RECLAMO_INTERVENCION_DISPARADOR=reclamo`.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EmergenciaSolicitadaListener
    messages:
      - $ref: '#/channels/emergenciaSolicitada/messages/emergenciaSolicitada'

  recibirEmergenciaBicicleta:
    action: receive
    channel:
      $ref: '#/channels/emergenciaBicicleta'
    summary: |
      Crea una emergencia externa `MEDICA` en `PENDING`, con prioridad derivada
      de P1-P4. Una sola por `data.emergenciaId`, que vuelve como `correlationId`
      en `EmergenciaCreada` y cada `EmergenciaActualizada`.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EmergenciaBicicletaListener
    messages:
      - $ref: '#/channels/emergenciaBicicleta/messages/emergenciaBicicleta'

  recibirReclamoCreado:
    action: receive
    channel:
      $ref: '#/channels/reclamoCreado'
    summary: |
      Plan B del caso: solo con `RECLAMO_INTERVENCION_DISPARADOR` en `reclamo` o
      `ambos`. Con `categoria = TRANSITO` y `objetoAfectado = CICLOVIA` crea una
      emergencia externa `TRANSITO` (causa `RECLAMO`, `causaId` = `reclamoId`),
      una sola por reclamo. Con el default (`movilidad`) se consume y no hace nada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ReclamoCreadoListener
    messages:
      - $ref: '#/channels/reclamoCreado/messages/reclamoCreado'

  recibirReclamoActualizado:
    action: receive
    channel:
      $ref: '#/channels/reclamoActualizado'
    summary: |
      Cuando el reclamo llega a RESUELTO, RECHAZADO o CERRADO, cancela su
      intervención si todavía no fue despachada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ReclamoActualizadoListener
    messages:
      - $ref: '#/channels/reclamoActualizado/messages/reclamoActualizado'

components:
  securitySchemes:
    oauthClientCredentials:
      type: oauth2
      description: |
        Token de servicio client-credentials del Login Federado
        (`claim.namespace = com.citypass.emergencias`). Se usa para SASL
        OAUTHBEARER en el broker y como Bearer en el schema registry y en
        `POST /api/v1/event-types/{fqn}/events`.
      flows:
        clientCredentials:
          tokenUrl: https://api.citypass-login.pp.ua/oauth/token
          availableScopes: {}

  messages:
    EmergenciaCreada:
      name: EmergenciaCreada
      title: Emergencia creada
      contentType: application/json
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EmergenciaCreadaData'
      examples:
        - name: botonPanico
          payload:
            metadata:
              eventId: 0b8d7a8e-2a64-4b8a-9d55-0d8f2a1c4e11
              eventType: EmergenciaCreada
              source: com.citypass.emergencias
            data:
              emergenciaId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              categoria: PANICO
              prioridad: CRITICA
              estado: PENDIENTE
              barrio: null
              latitud: null
              longitud: null
              ubicacion: { barrio: null, latitud: null, longitud: null }
              afectaCirculacion: false
              causaId: null
              causaTipo: null
              prioridadOriginal: null
              ciudadanoId: CIT-JuanPanico
              correlationId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              createdAt: '2026-11-02T22:59:08.205Z'

    EmergenciaActualizada:
      name: EmergenciaActualizada
      title: Emergencia actualizada
      contentType: application/json
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EmergenciaActualizadaData'
      examples:
        - name: despachada
          payload:
            metadata:
              eventId: 6f0c1e44-7d0b-4b1e-8a2d-3c9f5e7a1b22
              eventType: EmergenciaActualizada
              source: com.citypass.emergencias
            data:
              emergenciaId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              estadoAnterior: VALIDADA
              estadoNuevo: DESPACHADA
              updatedAt: '2026-11-02T23:05:00.000Z'
              resueltoAt: null
              usuarioId: DSP-Ana
              asignadoA: 9a1b2c3d-0000-4000-8000-000000000001
              areaResponsable: null
              resolucion: null
              prioridad: CRITICA
              causasRelacionadas: []
              descripcionProblema: null
              barrio: null
              latitud: null
              longitud: null
              ubicacion:
                barrio: null
                latitud: null
                longitud: null
              correlationId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13

    EmergenciaVinculadaAContextoZona:
      name: EmergenciaVinculadaAContextoZona
      title: Emergencia vinculada a un contexto de zona
      contentType: application/json
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EmergenciaVinculadaAContextoZonaData'
      examples:
        - name: vinculada a un evento comunitario
          payload:
            metadata:
              eventId: 0b7e3c55-2f1a-4c9e-9d3b-7a6e5f4c3b21
              eventType: EmergenciaVinculadaAContextoZona
              source: com.citypass.emergencias
            data:
              emergenciaId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
