asyncapi: 3.1.0
info:
  title: Emergencias Backend — Eventos
  version: 0.1.0
  description: |
    Contrato de eventos del módulo de Emergencias y Seguridad (CityPass+, Grupo 6)
    en el bus EDA.

    - **Publica** `EmergenciaCreada` y `EmergenciaActualizada` (contrato cerrado en
      el issue #48 de `G6D2/demo-repository`, 2026-11-02). Los arma
      `src/services/emergency-events.js` y salen por el outbox transaccional
      (`OutboxPublisher`).
    - **Consume** `EventoComunitarioPublicado` y `EventoCancelado` de Espacios
      Públicos (cobertura preventiva, `src/listeners/cobertura-preventiva`).
    - **Consume** la alerta climática confirmada y finalizada de Espacios
      Públicos (prioridad por barrio, `src/listeners/alerta-climatica`):
      `CriticidadClimaticaConfirmada` y `CriticidadClimaticaFinalizada`
      (contrato real). Los canales `espaciospublicos.alerta-climatica.*` son el
      formato del ejemplo anterior, que el listener sigue aceptando.

    Sobre el bus los eventos viajan con el envelope `{ metadata, data }` que arma
    el gateway del Grupo 1 (Avro en formato Confluent, schema en
    `EDA_SCHEMA_REGISTRY_URL`). En modo `EDA_PUBLISHER_MODE=gateway` este backend
    POSTea solo `data`; el gateway agrega `metadata`.

    Entrega **at-least-once** y **sin orden garantizado** (ver
    `docs/diagramas/06-eventos.md`): los consumidores deduplican por
    `metadata.eventId`.

    Este archivo se valida en `npm test` (`src/tests/asyncapi.test.js`): el spec
    tiene que parsear y la salida de los builders tiene que cumplir los schemas
    de `data`. Si cambiás un builder, cambiá este archivo.
  license:
    name: MIT
  tags:
    - name: emergencias
    - name: cobertura-preventiva

defaultContentType: application/json

servers:
  gateway:
    host: test.citypass.mrfranco.net.ar
    protocol: kafka-secure
    description: |
      Broker del gateway EDA (Grupo 1). SASL_SSL con OAUTHBEARER: el token
      client-credentials sale del Login Federado (`EDA_OAUTH_*`). El host real
      del broker se configura con `KAFKA_BROKER`.
    security:
      - $ref: '#/components/securitySchemes/oauthClientCredentials'
    bindings:
      kafka:
        schemaRegistryUrl: https://test.citypass.mrfranco.net.ar/api/v1
        schemaRegistryVendor: confluent
  local:
    host: localhost:9092
    protocol: kafka
    description: Kafka del `docker-compose.yml` (sin SASL, JSON plano).

channels:
  emergenciaCreada:
    address: com.citypass.emergencias.EmergenciaCreada
    title: EmergenciaCreada
    description: |
      Alta de una emergencia: botón de pánico (`POST /api/panic-button`) o
      cobertura preventiva creada por el listener de Espacios.
      Con `EDA_PUBLISHER_MODE=kafka` sale por el topic `TOPIC_PANIC_BUTTON`
      (default `emergencias.boton-panico`).
    messages:
      emergenciaCreada:
        $ref: '#/components/messages/EmergenciaCreada'

  emergenciaActualizada:
    address: com.citypass.emergencias.EmergenciaActualizada
    title: EmergenciaActualizada
    description: |
      Cambio de estado de una emergencia (validate, discard, assign, en-route,
      on-scene, resolve, cancel, close). El cierre viaja como este mismo evento
      con `estadoNuevo = CERRADA` (`EmergenciaCerrada` quedó fuera del contrato).
      Con `EDA_PUBLISHER_MODE=kafka` sale por `TOPIC_EMERGENCIA_ESTADO_ACTUALIZADO`
      (default `emergencias.estado-actualizado`).
    messages:
      emergenciaActualizada:
        $ref: '#/components/messages/EmergenciaActualizada'

  emergenciaPriorizada:
    address: emergencias.priorizada
    title: EmergenciaPriorizada (interno)
    description: |
      Cambio de prioridad de un incidente (job de detección, cada 60s, solo si
      cambió la `priority`). **No es parte del contrato del bus**: el
      `GatewayPublisher` lo marca `SKIPPED`. Solo sale con
      `EDA_PUBLISHER_MODE=kafka` por `TOPIC_EMERGENCIA_PRIORIZADA`.
    servers:
      - $ref: '#/servers/local'
    messages:
      emergenciaPriorizada:
        $ref: '#/components/messages/EmergenciaPriorizada'

  eventoComunitarioPublicado:
    address: com.citypass.espacios.EventoComunitarioPublicado
    title: EventoComunitarioPublicado (Espacios Públicos)
    description: |
      Topic configurable con `EDA_TOPIC_EVENTO_PUBLICADO`. Espacios lo republica
      cada vez que cambian los inscriptos.
    messages:
      eventoComunitarioPublicado:
        $ref: '#/components/messages/EventoComunitarioPublicado'

  eventoCancelado:
    address: com.citypass.espacios.EventoCancelado
    title: EventoCancelado (Espacios Públicos)
    description: Topic configurable con `EDA_TOPIC_EVENTO_CANCELADO`.
    messages:
      eventoCancelado:
        $ref: '#/components/messages/EventoCancelado'

  criticidadClimaticaConfirmada:
    address: com.citypass.espacios.CriticidadClimaticaConfirmada
    title: CriticidadClimaticaConfirmada (Espacios Públicos)
    description: |
      Contrato real (guía "CityPass Eventos climáticos" de Espacios, 13/11/2026).
      Topic configurable con `EDA_TOPIC_ALERTA_CLIMATICA_CONFIRMADA`, sin default
      en el código: este FQN es el valor a cargar.
    messages:
      criticidadClimaticaConfirmada:
        $ref: '#/components/messages/CriticidadClimaticaConfirmada'

  criticidadClimaticaFinalizada:
    address: com.citypass.espacios.CriticidadClimaticaFinalizada
    title: CriticidadClimaticaFinalizada (Espacios Públicos)
    description: |
      Contrato real. Topic configurable con `EDA_TOPIC_ALERTA_CLIMATICA_FINALIZADA`,
      sin default en el código: este FQN es el valor a cargar.
    messages:
      criticidadClimaticaFinalizada:
        $ref: '#/components/messages/CriticidadClimaticaFinalizada'

  alertaClimaticaConfirmada:
    address: espaciospublicos.alerta-climatica.confirmada
    title: Alerta climática confirmada (formato de ejemplo, no real)
    description: |
      Formato del ejemplo anterior al contrato real; el listener lo sigue
      aceptando. El contrato real es `criticidadClimaticaConfirmada`.
      Topic configurable con `EDA_TOPIC_ALERTA_CLIMATICA_CONFIRMADA`, sin default:
      el nombre sale del ejemplo de Espacios y no sigue la convención
      `com.citypass.<ns>.<PascalCase>` del gateway, así que está por confirmar.
      Un cambio de gravedad o de barrios llega como otra confirmación con
      `version` mayor.
    messages:
      alertaClimaticaConfirmada:
        $ref: '#/components/messages/AlertaClimaticaConfirmada'

  alertaClimaticaFinalizada:
    address: espaciospublicos.alerta-climatica.finalizada
    title: Alerta climática finalizada (formato de ejemplo, no real)
    description: |
      Formato del ejemplo anterior al contrato real. El contrato real es
      `criticidadClimaticaFinalizada`.
      Topic configurable con `EDA_TOPIC_ALERTA_CLIMATICA_FINALIZADA`, sin default.
      El nombre y el payload están por confirmar con Espacios; Emergencias solo
      lee `alertaId`.
    messages:
      alertaClimaticaFinalizada:
        $ref: '#/components/messages/AlertaClimaticaFinalizada'

  reclamoCreado:
    address: com.citypass.reclamos.ReclamoCreado.v3
    title: ReclamoCreado v3 (Reclamos)
    description: |
      Topic configurable con `EDA_TOPIC_RECLAMO_CREADO`. La versión vigente del
      tipo es la 3 y va en su propio tópico (la 1 no trae `objetoAfectado`).
    messages:
      reclamoCreado:
        $ref: '#/components/messages/ReclamoCreado'

  reclamoActualizado:
    address: com.citypass.reclamos.ReclamoActualizado
    title: ReclamoActualizado (Reclamos)
    description: Topic configurable con `EDA_TOPIC_RECLAMO_ACTUALIZADO`.
    messages:
      reclamoActualizado:
        $ref: '#/components/messages/ReclamoActualizado'

operations:
  publicarEmergenciaCreada:
    action: send
    channel:
      $ref: '#/channels/emergenciaCreada'
    summary: Publica el alta de una emergencia.
    messages:
      - $ref: '#/channels/emergenciaCreada/messages/emergenciaCreada'

  publicarEmergenciaActualizada:
    action: send
    channel:
      $ref: '#/channels/emergenciaActualizada'
    summary: Publica un cambio de estado de una emergencia.
    messages:
      - $ref: '#/channels/emergenciaActualizada/messages/emergenciaActualizada'

  publicarEmergenciaPriorizada:
    action: send
    channel:
      $ref: '#/channels/emergenciaPriorizada'
    summary: Publica el cambio de prioridad de un incidente (solo Kafka directo).
    messages:
      - $ref: '#/channels/emergenciaPriorizada/messages/emergenciaPriorizada'

  recibirEventoComunitarioPublicado:
    action: receive
    channel:
      $ref: '#/channels/eventoComunitarioPublicado'
    summary: |
      Programa una cobertura preventiva (emergencia `PREVENTIVA`) si la capacidad
      supera `UMBRAL_CAPACIDAD_COBERTURA_PREVENTIVA` (default 500). Además registra
      un contexto de zona en el punto del evento (`latitud`, `longitud`) con un
      radio fijo (`CONTEXTO_ZONA_RADIO_DEFAULT_METROS`, default 500): mientras dura
      (`inicio`–`fin`), las emergencias que se crean dentro de ese radio suben un
      nivel de prioridad de despacho.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EventoComunitarioPublicadoListener
    messages:
      - $ref: '#/channels/eventoComunitarioPublicado/messages/eventoComunitarioPublicado'

  recibirEventoCancelado:
    action: receive
    channel:
      $ref: '#/channels/eventoCancelado'
    summary: |
      Cancela la cobertura preventiva del evento si todavía no fue despachada y da
      de baja su contexto de zona (la prioridad de las emergencias cercanas vuelve a la normal).
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.EventoCanceladoListener
    messages:
      - $ref: '#/channels/eventoCancelado/messages/eventoCancelado'

  recibirCriticidadClimaticaConfirmada:
    action: receive
    channel:
      $ref: '#/channels/criticidadClimaticaConfirmada'
    summary: |
      Registra un contexto de zona por alerta (`alertaId`) con los `barrios` del
      catálogo; si viene vacío, los deriva de `ubicaciones` por polígono (hasta
      50). Mientras dura (`vigenciaDesde` a `vigenciaHasta` + 3 h de tope), las
      emergencias abiertas de esos barrios suben un nivel de prioridad de
      despacho, solo para los tipos que afecta el `fenomeno` y solo con
      `nivelCriticidad` ALTA o CRITICA. Con BAJA o MEDIA el contexto existe y se
      avisa en el tablero, pero no eleva.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.AlertaClimaticaConfirmadaListener
    messages:
      - $ref: '#/channels/criticidadClimaticaConfirmada/messages/criticidadClimaticaConfirmada'

  recibirCriticidadClimaticaFinalizada:
    action: receive
    channel:
      $ref: '#/channels/criticidadClimaticaFinalizada'
    summary: |
      Da de baja el contexto de zona de ese `alertaId`: la prioridad de las
      emergencias de esos barrios vuelve a la normal en la próxima lectura.
      `finalizadaEn` no se usa para ordenar (es reloj de Espacios).
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.AlertaClimaticaFinalizadaListener
    messages:
      - $ref: '#/channels/criticidadClimaticaFinalizada/messages/criticidadClimaticaFinalizada'

  recibirAlertaClimaticaConfirmada:
    action: receive
    channel:
      $ref: '#/channels/alertaClimaticaConfirmada'
    summary: |
      Registra un contexto de zona por alerta (`alertaId`) con sus barrios del
      catálogo. Mientras dura, las emergencias abiertas de esos barrios suben un
      nivel de prioridad de despacho, solo para los tipos que afecta el
      `fenomeno` y solo con `gravedad` ALTA o EXTREMA
      (`CONTEXTO_CLIMA_GRAVEDAD_MINIMA`). Con LEVE o MEDIA el contexto existe y
      se avisa en el tablero, pero no eleva. Una `version` menor que la guardada
      no pisa nada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.AlertaClimaticaConfirmadaListener
    messages:
      - $ref: '#/channels/alertaClimaticaConfirmada/messages/alertaClimaticaConfirmada'

  recibirAlertaClimaticaFinalizada:
    action: receive
    channel:
      $ref: '#/channels/alertaClimaticaFinalizada'
    summary: |
      Da de baja el contexto de zona de la alerta: la prioridad de las
      emergencias de esos barrios vuelve a la normal en la próxima lectura. Si
      llega antes que la confirmación, la confirmación tardía se ignora.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.AlertaClimaticaFinalizadaListener
    messages:
      - $ref: '#/channels/alertaClimaticaFinalizada/messages/alertaClimaticaFinalizada'

  recibirReclamoCreado:
    action: receive
    channel:
      $ref: '#/channels/reclamoCreado'
    summary: |
      Con `categoria = TRANSITO` y `objetoAfectado = CICLOVIA` crea una emergencia
      externa `TRANSITO` (causa `RECLAMO`, `causaId` = `reclamoId`), una sola por
      reclamo. El resto de los reclamos no hace nada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ReclamoCreadoListener
    messages:
      - $ref: '#/channels/reclamoCreado/messages/reclamoCreado'

  recibirReclamoActualizado:
    action: receive
    channel:
      $ref: '#/channels/reclamoActualizado'
    summary: |
      Cuando el reclamo llega a RESUELTO, RECHAZADO o CERRADO, cancela su
      intervención si todavía no fue despachada.
    bindings:
      kafka:
        groupId:
          type: string
          const: com.citypass.emergencias.ReclamoActualizadoListener
    messages:
      - $ref: '#/channels/reclamoActualizado/messages/reclamoActualizado'

components:
  securitySchemes:
    oauthClientCredentials:
      type: oauth2
      description: |
        Token de servicio client-credentials del Login Federado
        (`claim.namespace = com.citypass.emergencias`). Se usa para SASL
        OAUTHBEARER en el broker y como Bearer en el schema registry y en
        `POST /api/v1/event-types/{fqn}/events`.
      flows:
        clientCredentials:
          tokenUrl: https://api.citypass-login.pp.ua/oauth/token
          availableScopes: {}

  messages:
    EmergenciaCreada:
      name: EmergenciaCreada
      title: Emergencia creada
      contentType: application/json
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EmergenciaCreadaData'
      examples:
        - name: botonPanico
          payload:
            metadata:
              eventId: 0b8d7a8e-2a64-4b8a-9d55-0d8f2a1c4e11
              eventType: EmergenciaCreada
              source: com.citypass.emergencias
            data:
              emergenciaId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              categoria: PANICO
              prioridad: CRITICA
              estado: PENDIENTE
              barrio: null
              latitud: null
              longitud: null
              ubicacion: { barrio: null, latitud: null, longitud: null }
              afectaCirculacion: false
              causaId: null
              causaTipo: null
              prioridadOriginal: null
              ciudadanoId: CIT-JuanPanico
              correlationId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              createdAt: '2026-11-02T22:59:08.205Z'

    EmergenciaActualizada:
      name: EmergenciaActualizada
      title: Emergencia actualizada
      contentType: application/json
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EmergenciaActualizadaData'
      examples:
        - name: despachada
          payload:
            metadata:
              eventId: 6f0c1e44-7d0b-4b1e-8a2d-3c9f5e7a1b22
              eventType: EmergenciaActualizada
              source: com.citypass.emergencias
            data:
              emergenciaId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13
              estadoAnterior: VALIDADA
              estadoNuevo: DESPACHADA
              updatedAt: '2026-11-02T23:05:00.000Z'
              resueltoAt: null
              usuarioId: DSP-Ana
              asignadoA: 9a1b2c3d-0000-4000-8000-000000000001
              areaResponsable: null
              resolucion: null
              prioridad: CRITICA
              causasRelacionadas: []
              descripcionProblema: null
              barrio: null
              latitud: null
              longitud: null
              ubicacion:
                barrio: null
                latitud: null
                longitud: null
              correlationId: 5d1e9a7c-3b2f-4f61-9c8e-0a4b7d2e6f13

    EmergenciaPriorizada:
      name: EmergenciaPriorizada
      title: Emergencia priorizada (interno)
      contentType: application/json
      description: |
        Sale tal cual lo arma el builder (envelope propio, sin `metadata` del gateway).
      payload:
        type: object
        required: [type, eventId, correlationId, data]
        properties:
          type:
            type: string
            const: EmergenciaPriorizada
          eventId:
            type: string
            format: uuid
          correlationId:
            type: string
          data:
            $ref: '#/components/schemas/EmergenciaPriorizadaData'

    EventoComunitarioPublicado:
      name: EventoComunitarioPublicado
      title: Evento comunitario publicado
      contentType: application/json
      description: |
        Producido por Espacios Públicos. Solo se documentan los campos que lee
        `ProgramarCoberturaPreventivaRule`; el resto se ignora.
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EventoComunitarioPublicadoData'

    EventoCancelado:
      name: EventoCancelado
      title: Evento comunitario cancelado
      contentType: application/json
      description: Producido por Espacios Públicos. `motivo` no se publica de vuelta (texto libre).
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/EventoCanceladoData'

    CriticidadClimaticaConfirmada:
      name: CriticidadClimaticaConfirmada
      title: Criticidad climática confirmada
      contentType: application/json
      description: |
        Producido por Espacios Públicos cuando el administrador confirma una
        alerta. Espacios POSTea solo `data` al gateway; el gateway agrega
        `metadata` y lo publica en Avro (formato Confluent).
      payload:
        type: object
        required: [data]
        additionalProperties: true
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/CriticidadClimaticaConfirmadaData'
      examples:
        - name: olaDeCalorEnBalvaneraYSanNicolas
          summary: Ejemplo de la guía de Espacios, con el envelope del gateway
          payload:
            metadata:
              eventId: 3c9a7d21-5b6e-4f80-9a1b-2c3d4e5f6a7b
              eventType: com.citypass.espacios.CriticidadClimaticaConfirmada
              source: grupo7
            data:
              alertaId: f6029e4f-e0ef-46b8-9f1a-66e814f1c90e
              nivelCriticidad: ALTA
              fenomeno: OLA_DE_CALOR
              ubicaciones:
                - latitud: -34.6037
                  longitud: -58.3816
                - latitud: -34.609099
                  longitud: -58.403062
              barrios: [BALVANERA, SAN NICOLAS]
              vigenciaDesde: 1794603600000
              vigenciaHasta: 1794625200000
              temperaturaMinC: 28.0
              temperaturaMaxC: 38.0
              actorSub: admin-ejemplo

    CriticidadClimaticaFinalizada:
      name: CriticidadClimaticaFinalizada
      title: Criticidad climática finalizada
      contentType: application/json
      description: |
        Producido por Espacios Públicos al finalizar la alerta, a mano o por el
        cierre automático (`actorSub = system:weather-scheduler`). No repite
        ubicaciones, barrios ni criticidad.
      payload:
        type: object
        required: [data]
        additionalProperties: true
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/CriticidadClimaticaFinalizadaData'
      examples:
        - name: cierreDeLaOlaDeCalor
          summary: Ejemplo de la guía de Espacios, con el envelope del gateway
          payload:
            metadata:
              eventId: 8d2e4f60-1a3b-4c5d-8e9f-0a1b2c3d4e5f
              eventType: com.citypass.espacios.CriticidadClimaticaFinalizada
              source: grupo7
            data:
              alertaId: f6029e4f-e0ef-46b8-9f1a-66e814f1c90e
              finalizadaEn: 1794625200000
              actorSub: admin-ejemplo

    AlertaClimaticaConfirmada:
      name: AlertaClimaticaConfirmada
      title: Alerta climática confirmada
      contentType: application/json
      description: |
        Producido por Espacios Públicos. Se aceptan dos envelopes: el del gateway
        (`{ metadata, data }`) y el del ejemplo de Espacios, con `eventId`,
        `eventType`, `occurredAt` y `source` en la raíz. Solo se documentan los
        campos que lee Emergencias.
      payload:
        type: object
        required: [data]
        additionalProperties: true
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          eventId:
            type: string
          eventType:
            type: string
          occurredAt:
            type: string
            format: date-time
          source:
            type: string
          data:
            $ref: '#/components/schemas/AlertaClimaticaConfirmadaData'
      examples:
        - name: tormentaElectricaEnPalermo
          summary: Envelope plano del ejemplo de Espacios
          payload:
            eventId: 6b1f7c2e-4d3a-4f5b-8a9c-1d2e3f4a5b6c
            eventType: espaciospublicos.alerta-climatica.confirmada
            occurredAt: '2026-11-12T20:00:00Z'
            source: espacios-publicos
            data:
              alertaId: 0b0e5c1a-7f3e-4a8e-9a51-2d5f1c7e9b10
              version: 1
              fenomeno: TORMENTA_ELECTRICA
              gravedad: ALTA
              barrios: [PALERMO, VILLA CRESPO]
              fechaInicio: '2026-11-12T21:00:00Z'
              fechaFinEstimada: '2026-11-13T03:00:00Z'
              descripcion: Tormentas fuertes con ráfagas y caída de granizo

    AlertaClimaticaFinalizada:
      name: AlertaClimaticaFinalizada
      title: Alerta climática finalizada
      contentType: application/json
      description: |
        Producido por Espacios Públicos cuando el administrador cierra la alerta.
        Nombre y payload por confirmar: Emergencias solo lee `alertaId`. Acepta
        los mismos dos envelopes que la confirmación.
      payload:
        type: object
        required: [data]
        additionalProperties: true
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          eventId:
            type: string
          data:
            $ref: '#/components/schemas/AlertaClimaticaFinalizadaData'

    ReclamoCreado:
      name: ReclamoCreado
      title: Reclamo creado
      contentType: application/json
      description: Producido por Reclamos. `titulo`, `descripcion` y `direccion` no se publican de vuelta (texto libre).
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/ReclamoCreadoData'

    ReclamoActualizado:
      name: ReclamoActualizado
      title: Reclamo actualizado
      contentType: application/json
      description: Producido por Reclamos en cada cambio de estado del reclamo.
      payload:
        type: object
        required: [metadata, data]
        properties:
          metadata:
            $ref: '#/components/schemas/Metadata'
          data:
            $ref: '#/components/schemas/ReclamoActualizadoData'

  schemas:
    Metadata:
      type: object
      description: |
        Envelope que agrega el gateway EDA. `eventId` es la clave de
        deduplicación (`eventos_procesados`).
      required: [eventId]
      additionalProperties: true
      properties:
        eventId:
          type: string
        eventType:
          type: string
        source:
          type: string
        occurredAt:
          type: string
          format: date-time
        version:
          type: string
        causationId:
          type: [string, 'null']

    Prioridad:
      type: string
      enum: [BAJA, MEDIA, ALTA, CRITICA]

    Estado:
      type: string
      description: Traducción de `emergencies.status` (ver `STATUS_TO_ESTADO`).
      enum: [PENDIENTE, VALIDADA, DESPACHADA, EN_CAMINO, EN_LUGAR, RESUELTA, CERRADA, DESCARTADA, CANCELADA]

    Categoria:
      type: string
      description: Catálogo de `src/domain/emergency-type.js`.
      enum: [MEDICA, INCENDIO, INFRAESTRUCTURA, DISTURBIO_EVENTO_MASIVO, OTRO, PANICO, PREVENTIVA, TRANSITO]

    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC.

    EmergenciaCreadaData:
      type: object
      additionalProperties: false
      required:
        - emergenciaId
        - categoria
        - prioridad
        - estado
        - barrio
        - latitud
        - longitud
        - ubicacion
        - afectaCirculacion
        - causaId
        - causaTipo
        - prioridadOriginal
        - ciudadanoId
        - correlationId
        - createdAt
      properties:
        emergenciaId:
          type: string
        categoria:
          oneOf:
            - $ref: '#/components/schemas/Categoria'
            - type: 'null'
        prioridad:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        estado:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        barrio:
          type: [string, 'null']
          description: Barrio del catálogo oficial de CABA (48), en claro. Lo leen Reclamos y Analítica.
        latitud:
          type: [number, 'null']
          description: Latitud en claro, redondeada a 3 decimales (~100 m). Null si la emergencia no tiene ubicación. Es la que leen los consumidores; la exacta va cifrada en `ubicacion`.
        longitud:
          type: [number, 'null']
          description: Igual que `latitud`.
        ubicacion:
          type: object
          additionalProperties: false
          required: [barrio, latitud, longitud]
          properties:
            barrio:
              type: [string, 'null']
              description: Mismo valor que `barrio`, anidado para Espacios.
            latitud:
              type: [string, 'null']
              description: Coordenada exacta, ciphertext AES-256-GCM con la clave de bus (ver docs/bus-ubicacion-para-consumidores.md). Null sin clave de bus.
            longitud:
              type: [string, 'null']
              description: Igual que `latitud`. La versión aproximada en claro va en la raíz de `data`.
        afectaCirculacion:
          type: [boolean, 'null']
          description: Derivado de `categoria`. true para INCENDIO, INFRAESTRUCTURA, DISTURBIO_EVENTO_MASIVO y PREVENTIVA; false para MEDICA, PANICO y OTRO; null sin categoría.
        causaId:
          type: [string, 'null']
        causaTipo:
          type: [string, 'null']
          examples: [EVENTO_PUBLICO]
        prioridadOriginal:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        ciudadanoId:
          type: [string, 'null']
        correlationId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    EmergenciaActualizadaData:
      type: object
      additionalProperties: false
      required:
        - emergenciaId
        - estadoAnterior
        - estadoNuevo
        - updatedAt
        - resueltoAt
        - usuarioId
        - asignadoA
        - areaResponsable
        - resolucion
        - prioridad
        - causasRelacionadas
        - descripcionProblema
        - barrio
        - latitud
        - longitud
        - ubicacion
        - correlationId
      properties:
        emergenciaId:
          type: string
        estadoAnterior:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        estadoNuevo:
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        resueltoAt:
          description: Solo en transición a `RESUELTA`.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        usuarioId:
          type: [string, 'null']
          description: Actor del request.
        asignadoA:
          type: [string, 'null']
          description: Oficial asignado, solo en `DESPACHADA`.
        areaResponsable:
          type: [string, 'null']
          description: Null hasta #85.
        resolucion:
          type: [string, 'null']
        prioridad:
          oneOf:
            - $ref: '#/components/schemas/Prioridad'
            - type: 'null'
        causasRelacionadas:
          type: array
          default: []
          items:
            type: string
            enum: [VIA, ESPACIO_PUBLICO, RESIDUOS]
        descripcionProblema:
          type: [string, 'null']
          maxLength: 280
          description: Descripción breve del problema vial. Se completa al resolver si causasRelacionadas incluye VIA y se conserva en actualizaciones posteriores.
        barrio:
          type: [string, 'null']
          description: Barrio del catálogo oficial de CABA (48), en claro.
        latitud:
          type: [number, 'null']
          description: Latitud en claro, redondeada a 3 decimales (~100 m). Null si la emergencia no tiene ubicación. Es la que leen los consumidores; la exacta va cifrada en `ubicacion`.
        longitud:
          type: [number, 'null']
          description: Igual que `latitud`.
        ubicacion:
          type: object
          additionalProperties: false
          required: [barrio, latitud, longitud]
          properties:
            barrio:
              type: [string, 'null']
            latitud:
              type: [string, 'null']
              description: Ciphertext AES-256-GCM con la clave de bus. Null sin clave de bus.
            longitud:
              type: [string, 'null']
              description: Ciphertext AES-256-GCM con la clave de bus. Null sin clave de bus.
        correlationId:
          type: string
      allOf:
        - description: Se requiere una descripción no vacía cuando las causas incluyen VIA; en los demás casos debe ser null.
          if:
            properties:
              causasRelacionadas:
                contains:
                  const: VIA
          then:
            properties:
              descripcionProblema:
                type: string
                minLength: 1
          else:
            properties:
              descripcionProblema:
                type: 'null'

    EmergenciaPriorizadaData:
      type: object
      additionalProperties: false
      required: [id, correlationId, incidentId, priorityIndividual, incidentPriority, priority, score, reasonCodes, algorithmVersion]
      properties:
        id:
          type: string
        correlationId:
          type: string
        incidentId:
          type: string
        priorityIndividual:
          type: [string, 'null']
        incidentPriority:
          type: [string, 'null']
        priority:
          type: [string, 'null']
        score:
          type: [number, 'null']
        reasonCodes:
          type: [array, 'null']
          items:
            type: string
        algorithmVersion:
          type: [string, 'null']

    EventoComunitarioPublicadoData:
      type: object
      additionalProperties: true
      required: [eventoId]
      properties:
        eventoId:
          type: string
          minLength: 1
        titulo:
          type: string
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        direccion:
          type: [string, 'null']
        capacidad:
          type: number
          description: Asistentes esperados. Si falta se usa `cupoMaximo`.
        cupoMaximo:
          type: number
        estado:
          type: string
          description: Con `CANCELLED` no se programa cobertura y se da de baja el contexto de zona.
        inicio:
          description: |
            Inicio del evento (ISO 8601 o epoch). También se lee `fechaInicio`. Es el
            comienzo de la ventana en la que sube la prioridad del barrio; si falta,
            la ventana arranca al recibir el evento.
        fin:
          description: |
            Fin del evento (ISO 8601 o epoch). También se lee `fechaFin`. Si falta,
            la ventana dura `CONTEXTO_ZONA_DURACION_DEFAULT_HORAS` (default 6).
        zona:
          type: [string, 'null']
          description: Texto libre. Solo se usa sin coordenadas, si coincide con un barrio de CABA.
        correlationId:
          type: string
          description: En Espacios no es UUID (`evento-<id>`).

    EventoCanceladoData:
      type: object
      additionalProperties: true
      required: [eventoId]
      properties:
        eventoId:
          type: string
          minLength: 1
        motivo:
          type: string
        canceladoEn:
          $ref: '#/components/schemas/Timestamp'

    CriticidadClimaticaConfirmadaData:
      type: object
      additionalProperties: true
      description: |
        Campos del contrato real de Espacios. Las fechas son Unix en
        milisegundos (Avro `long` con `timestamp-millis`).
      required: [alertaId, nivelCriticidad, fenomeno, ubicaciones, vigenciaDesde, vigenciaHasta, actorSub]
      properties:
        alertaId:
          type: string
          format: uuid
          description: Relaciona la confirmación con su finalización. Un contexto de zona por alerta.
        nivelCriticidad:
          type: string
          enum: [BAJA, MEDIA, ALTA, CRITICA]
          description: Emergencias la traduce a gravedad (CRITICA = EXTREMA). Solo ALTA y CRITICA elevan.
        fenomeno:
          type: string
          enum: [TORMENTA_FUERTE, LLUVIA_INTENSA, VIENTO_FUERTE, OLA_DE_CALOR, OLA_DE_FRIO, GRANIZO, TORMENTA_ELECTRICA, HURACAN, NIEVE]
          description: Qué tipos de emergencia afecta cada uno lo define Emergencias (`src/domain/alerta-climatica.js`).
        ubicaciones:
          type: array
          items:
            type: object
            required: [latitud, longitud]
            properties:
              latitud:
                type: number
              longitud:
                type: number
          description: Puntos consultados. Si `barrios` viene vacío, Emergencias deriva los barrios de acá.
        barrios:
          type: array
          default: []
          items:
            type: string
          description: Barrios de CABA calculados por Espacios con polígonos, en mayúsculas.
        vigenciaDesde:
          type: integer
          description: Inicio de la vigencia, Unix ms.
        vigenciaHasta:
          type: integer
          description: Fin previsto, Unix ms. Si la finalización no llega, la alerta deja de pesar 3 h después.
        temperaturaMinC:
          type: [number, 'null']
        temperaturaMaxC:
          type: [number, 'null']
        actorSub:
          type: string
          description: Quién confirmó. Emergencias no lo usa.

    CriticidadClimaticaFinalizadaData:
      type: object
      additionalProperties: true
      required: [alertaId, finalizadaEn, actorSub]
      properties:
        alertaId:
          type: string
          format: uuid
        finalizadaEn:
          type: integer
          description: Cierre registrado por Espacios, Unix ms. Puede diferir de `vigenciaHasta`.
        actorSub:
          type: string
          description: Quién cerró; `system:weather-scheduler` en el cierre automático.

    AlertaClimaticaConfirmadaData:
      type: object
      additionalProperties: true
      required: [alertaId, barrios]
      properties:
        alertaId:
          type: string
          format: uuid
          description: Identifica la alerta. Un solo contexto de zona por alerta.
        version:
          type: integer
          minimum: 0
          description: Una versión menor que la ya registrada no pisa nada.
        fenomeno:
          type: string
          description: |
            LLUVIA_FUERTE, TORMENTA_ELECTRICA y TORNADO salen del contrato; el resto
            del catálogo (VIENTO_FUERTE, GRANIZO, INUNDACION, OLA_DE_CALOR,
            FRIO_EXTREMO, NIEBLA) está por confirmar. Uno desconocido eleva solo
            INFRAESTRUCTURA.
        gravedad:
          type: string
          description: LEVE, MEDIA, ALTA o EXTREMA. Por debajo de ALTA, o desconocida, no eleva.
        barrios:
          type: array
          items:
            type: string
          description: |
            Barrios de CABA. Se comparan con el catálogo sin importar mayúsculas ni
            acentos. Los que no están se ignoran; sin ninguno válido no hay contexto.
        fechaInicio:
          $ref: '#/components/schemas/Timestamp'
        fechaFinEstimada:
          type: string
          format: date-time
          description: |
            Informativa. Si la finalización no llega, la alerta deja de pesar
            `CONTEXTO_CLIMA_MARGEN_HORAS` (3) después; sin este campo,
            `CONTEXTO_CLIMA_TOPE_HORAS` (24) después del inicio.
        descripcion:
          type: string

    AlertaClimaticaFinalizadaData:
      type: object
      additionalProperties: true
      required: [alertaId]
      properties:
        alertaId:
          type: string
          format: uuid

    ReclamoCreadoData:
      type: object
      additionalProperties: true
      description: Solo los campos que lee Emergencias. El schema completo está en `docs/avro/ReclamoCreado.avsc` del repo de Reclamos.
      required: [reclamoId, categoria]
      properties:
        reclamoId:
          type: string
          minLength: 1
        categoria:
          type: string
          description: Solo `TRANSITO` dispara una intervención.
        objetoAfectado:
          type: [string, 'null']
          description: Lo elige el vecino; puede venir null. Solo `CICLOVIA` dispara una intervención.
        prioridad:
          type: string
          description: BAJA, MEDIA, ALTA o CRITICA. Define la prioridad de la emergencia.
        estado:
          type: string
        titulo:
          type: string
        direccion:
          type: [string, 'null']
        barrio:
          type: [string, 'null']
        latitud:
          type: [number, 'null']
        longitud:
          type: [number, 'null']
        afectaCirculacion:
          type: boolean
        correlationId:
          type: [string, 'null']
        createdAt:
          type: integer
          description: Epoch en milisegundos.

    ReclamoActualizadoData:
      type: object
      additionalProperties: true
      required: [reclamoId, estadoNuevo]
      properties:
        reclamoId:
          type: string
          minLength: 1
        estadoAnterior:
          type: string
        estadoNuevo:
          type: string
          description: RECIBIDO, EN_REVISION, ASIGNADO, EN_PROCESO, RESUELTO, RECHAZADO o CERRADO. Los tres últimos cancelan la intervención pendiente.
        updatedAt:
          type: integer
          description: Epoch en milisegundos.
