name: Keep warm

# Render (plan free) duerme el servicio tras 15 minutos sin tráfico y tarda
# entre 50 y 60 segundos en despertar. Este workflow hace el PRIMER despertar
# del jueves (horario de clase, hora Argentina, UTC-3): a partir de ahí el
# backend se mantiene solo con el job in-process `src/jobs/keep-warm.js`, que
# cada KEEP_WARM_INTERVAL_MS (8 min) pega a su propia URL pública y al
# /api/warmup del frontend, únicamente dentro de KEEP_WARM_WINDOWS
# (default jueves 17:00–23:30 ART). Así no se consumen las 750 horas gratis
# mensuales de Render manteniéndolo siempre prendido.
#
# Los crons de GitHub Actions son "best effort": pueden demorarse o saltearse
# (el jueves 10/09 no corrió ninguna ejecución programada). Por eso:
#   - los minutos son 7,27,47 y no 0/20/40 (los minutos "redondos" son los
#     de mayor cola en GitHub);
#   - hay un cron extra de despertar a las 16:50 ART (19:50 UTC) antes de que
#     empiece la clase;
#   - los pings periódicos siguen como respaldo por si el backend se durmió
#     igual (por ejemplo, tras un deploy o un reinicio de Render).
#
# Para una demo fuera de ese horario: Actions → Keep warm → Run workflow (y,
# si hace falta, ampliar KEEP_WARM_WINDOWS en Render).

on:
  schedule:
    # Despertar inicial: jueves 19:50 UTC (16:50 ART).
    - cron: '50 19 * * 4'
    # Respaldo: jueves 20:00–23:59 UTC (17:00–20:59 ART) y viernes
    # 00:00–02:59 UTC (21:00–23:59 ART del jueves), cada 20 minutos.
    - cron: '7,27,47 20-23 * * 4'
    - cron: '7,27,47 0-2 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping backend (y frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://emergencias-backend-34go.onrender.com' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Backend /health
        run: |
          echo "GET $BACKEND_URL/health"
          curl -sS --max-time 120 --retry 2 --retry-delay 15 -w '\nhttp %{http_code} en %{time_total}s\n' "$BACKEND_URL/health"

      - name: Frontend /api/warmup
        if: env.FRONTEND_URL != ''
        run: |
          echo "GET $FRONTEND_URL/api/warmup"
          curl -sS --max-time 120 --retry 2 --retry-delay 15 -w '\nhttp %{http_code} en %{time_total}s\n' "$FRONTEND_URL/api/warmup"
