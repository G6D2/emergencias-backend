name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check title is not empty
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$(echo "$TITLE" | tr -d '[:space:]')" ]; then
            echo "::error::El título del PR no puede estar vacío."
            exit 1
          fi
          echo "✓ Título: $TITLE"

      - name: Check description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip HTML comments and markdown headers, then check if anything remains
          content=$(printf '%s' "$BODY" | sed '/<!--/,/-->/d' | grep -v '^[[:space:]]*$' | grep -v '^#' || true)
          if [ -z "$content" ]; then
            echo "::error::La descripción del PR no puede estar vacía. Completá las secciones del template."
            exit 1
          fi
          echo "✓ Descripción presente"

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: emergencias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
        run: npm run migrate

      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
        run: npm test
