name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title is not empty
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$(echo "$TITLE" | tr -d '[:space:]')" ]; then
            echo "::error::El título del PR no puede estar vacío."
            exit 1
          fi
          echo "✓ Título: $TITLE"

      - name: Check description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip HTML comments and markdown headers, then check if anything remains
          content=$(printf '%s' "$BODY" | sed '/<!--/,/-->/d' | grep -v '^[[:space:]]*$' | grep -v '^#' || true)
          if [ -z "$content" ]; then
            echo "::error::La descripción del PR no puede estar vacía. Completá las secciones del template."
            exit 1
          fi
          echo "✓ Descripción presente"

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: emergencias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm run migrate

      - name: Unit tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm test

      - name: Integration tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm run test:integration

  notify-failure:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [validate-pr, lint-and-test]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI falló — ${{ github.ref_name }} (${{ github.actor }})"
          to: ${{ secrets.MAIL_TO }}
          from: CityPass+ CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            El pipeline de CI falló en ${{ github.repository }}.

            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Actor:    ${{ github.actor }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
