name: CI
# Prefijo del run: distingue PR vs push a main en la lista de Actions.
run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('push {0}', github.ref_name) }} · ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  # push solo en main: en las branches de feature ya corre por el PR.
  # Asi cada push a un PR dispara UNA corrida, no dos.
  push:
    branches: [main]

# Si llega otro push del mismo PR/branch, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # comentario de cobertura en el PR

jobs:
  validate-pr:
    name: Validate PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title is not empty
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$(echo "$TITLE" | tr -d '[:space:]')" ]; then
            echo "::error::El título del PR no puede estar vacío."
            exit 1
          fi
          echo "✓ Título: $TITLE"

      - name: Check description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip HTML comments and markdown headers, then check if anything remains
          content=$(printf '%s' "$BODY" | sed '/<!--/,/-->/d' | grep -v '^[[:space:]]*$' | grep -v '^#' || true)
          if [ -z "$content" ]; then
            echo "::error::La descripción del PR no puede estar vacía. Completá las secciones del template."
            exit 1
          fi
          echo "✓ Descripción presente"

  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: emergencias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm run migrate

      - name: Unit tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm test

      - name: Integration tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emergencias_test
          DATABASE_SSL: 'false'
        run: npm run test:integration

      # Resumen de cobertura: en la pagina del run (Summary) y como comentario
      # unico en el PR (se edita en cada corrida, no se acumulan).
      - name: Coverage summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          f=coverage/coverage-summary.json
          if [ ! -f "$f" ]; then echo "Sin coverage-summary.json (los tests no llegaron a correr)" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k, label) => `| ${label} | **${t[k].pct}%** | ${t[k].covered}/${t[k].total} |`;
            const md = [
              "<!-- cobertura -->",
              "## 📊 Cobertura de tests unitarios",
              "",
              "| Métrica | % | Cubierto/Total |",
              "|---|---|---|",
              row("statements", "Statements"), row("branches", "Branches"), row("functions", "Functions"), row("lines", "Lines"),
              "",
              "Umbral: 80% en las cuatro métricas. Reporte completo en el artefacto `coverage-*` del run.",
            ].join("\n");
            require("fs").writeFileSync("coverage-comment.md", md);
          '
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | startswith("<!-- cobertura -->")) | .id' | head -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$(cat coverage-comment.md)" >/dev/null
            else
              gh pr comment "$PR_NUMBER" --body-file coverage-comment.md
            fi
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/
          retention-days: 7

      # Analisis externo: no bloquea el pipeline. Corre solo si el repo tiene
      # SONAR_TOKEN (SonarCloud gratis exige repo publico; el nuestro es privado).
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify-failure:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [validate-pr, lint-and-test]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI falló — Backend ${{ github.ref_name }} (${{ github.actor }})"
          to: ${{ secrets.MAIL_TO }}
          from: CityPass+ CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            El pipeline de CI del Backend falló en ${{ github.repository }}.

            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Actor:    ${{ github.actor }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
