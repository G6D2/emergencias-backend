name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLYWAY_BASELINE_ON_MIGRATE: 'true'
          FLYWAY_BASELINE_VERSION: '5'
        run: npm run migrate

      - name: Deploy to Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"

  notify-failure:
    name: Notify deploy failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Deploy falló — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: CityPass+ CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            El pipeline de deploy a producción falló en ${{ github.repository }}.

            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Actor:    ${{ github.actor }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
